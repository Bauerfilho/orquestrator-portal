# Testes do portal: livro-razão (vetores do plano), servidor do diário e cliente do diário (cifra, conflito, adulteração).
name: testes
on:
  push:
    branches: ['**']
  pull_request:
permissions:
  contents: read
jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test testes/*.test.mjs
