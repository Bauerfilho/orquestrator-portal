<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; connect-src 'self' https://orquestrator-diario.netlify.app https://olinda.bcb.gov.br; img-src 'self' data:; frame-src blob:; child-src blob:; font-src 'none'; object-src 'none'; base-uri 'none'; form-action 'self'; manifest-src 'self'">
  <meta name="color-scheme" content="light dark">
  <meta name="robots" content="noindex, nofollow">
  <title>Vitrine dos gráficos · Finanças (arnês)</title>
  <!-- Arnês: os gráficos do graficos.js com dados fictícios, com a mesma CSP e as mesmas folhas de estilo do portal.
       Fotografe com: node ferramentas/arnes/fotografar.mjs --vitrine -->
  <script src="../../tema.js"></script>
  <link rel="stylesheet" href="../../style.css">
  <link rel="stylesheet" href="../../tema.css">
  <link rel="stylesheet" href="../../livro.css">
  <style>
    .vitrine{max-width:1080px;margin:0 auto;padding:32px 24px 64px}
    .vitrine h1{font:400 34px/1.15 var(--serif);letter-spacing:-.02em;margin:0 0 8px}
    .vitrine-intro{color:var(--muted);font-size:14px;max-width:70ch;margin:0 0 28px}
    .vitrine-grupo{font:600 12px/1.3 var(--sans);letter-spacing:.14em;text-transform:uppercase;color:var(--gold);margin:34px 0 12px}
    .vitrine-grade{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
    .vitrine-grade .lv-cartao{margin:0}
    @media (max-width:820px){.vitrine-grade{grid-template-columns:1fr}}
    @media (max-width:620px){.vitrine{padding:20px 16px 48px}.vitrine h1{font-size:28px}}
  </style>
  <script type="module" src="vitrine-graficos.js"></script>
</head>
<body>
  <main class="vitrine" id="vitrine">
    <p class="eyebrow">Arnês · dados fictícios</p>
    <h1>Vitrine dos gráficos</h1>
    <p class="vitrine-intro">Cada gráfico novo com um tab stop (setas, Home e End movem a dica), a tabela equivalente em “Ver tabela” e a linha “Como ler”. Os números são de mentira e chegam prontos em centavos: o gráfico não soma nada.</p>
  </main>
</body>
</html>
