<!-- stand:tema:inicio -->
<script>
// Stand · tema. Roda no <head>, antes da primeira pintura: o portal manda o tema no fragmento (#tema=claro|escuro);
// aberto sozinho, segue o sistema. Nada de storage: dentro da moldura do portal (sandbox sem mesma origem) ele lança.
(function () {
  var m = /(?:^#|&)tema=(claro|escuro)/.exec(location.hash);
  var escuro = window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches;
  document.documentElement.setAttribute("data-tema", m ? m[1] : (escuro ? "escuro" : "claro"));
  if (m) document.documentElement.setAttribute("data-portal", "");
})();
</script>

<style>
/* Stand · estilo. A moldura de cada maquete: barra de estados, palco (tela ampla ou celular), ficha e código.

:root{--st-fundo:#f4f3ee;--st-papel:#fff;--st-tinta:#15211a;--st-suave:#5a655e;--st-fio:rgba(21,33,26,.10);--st-fio-forte:rgba(21,33,26,.18);

:root[data-tema=escuro]{--st-fundo:#10110f;--st-papel:#191a17;--st-tinta:#f0ebdf;--st-suave:#aaa69d;--st-fio:rgba(240,235,223,.10);--st-fio-forte:rgba(240,235,223,.2);
  --st-ouro:#ead3a3;--st-ouro-forma:#cfac69;--st-tingido:rgba(240,235,223,.06);--st-tingido-forte:rgba(240,235,223,.11);
  --st-vidro:rgba(22,23,20,.84);--st-sombra:0 1px 2px rgba(0,0,0,.3),0 24px 60px rgba(0,0,0,.45)}
html,body{margin:0}
body.stand-corpo{background:var(--st-fundo);min-height:100vh}
.stand-barra,.stand-barra *,.stand-gaveta,.stand-gaveta *,.stand-pilula{box-sizing:border-box}
.stand-barra{position:sticky;top:0;z-index:2147483000;display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;padding:9px 16px;

/* lista de notas */

#app .cd-ordem{margin-left:auto;display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 10px;border-radius:8px;color:var(--cd-suave);font-size:12.5px;font-weight:600}

#app .cd-cartao{position:relative;display:block;width:100%;padding:13px 14px 12px 17px;border-radius:13px;border:1px solid transparent}

#app .cd-cartao[aria-current=true]{background:var(--cd-papel);border-color:var(--cd-fio);box-shadow:0 1px 0 rgba(255,255,255,.5) inset,0 10px 22px -14px rgba(60,40,15,.45)}

#app .cd-etq-novo{width:110px;height:26px;padding:0 10px;border-radius:99px;border:1px solid var(--cd-verm);background:var(--cd-papel);outline:0;font-size:12.5px}
#app .cd-barra{display:flex;align-items:center;gap:2px;flex:none;margin:12px 0 0;padding:6px 50px;border-top:1px solid var(--cd-fio);border-bottom:1px solid var(--cd-fio);background:var(--cd-lista);overflow-x:auto;scrollbar-width:none}

  background-size:100% 100%,100% 28px;background-repeat:no-repeat,repeat-y;background-position:0 0,0 14px;background-attachment:scroll,local}

/* leitura */

#app .cd-folha{width:100%;max-width:728px;margin:0 auto;padding:58px 48px 140px}

#app .cd-prosa pre{position:relative;margin:1.5em 0;padding:18px 20px;border-radius:14px;background:var(--cd-codigo);border:1px solid var(--cd-fio);overflow:auto;scrollbar-width:thin}

#app .cd-trilho{position:sticky;top:0;align-self:start;padding:62px 28px 40px 0;font-size:13px}

#app .cd-trilho p{margin:8px 0 0;color:var(--cd-suave)}
#app .cd-refs{list-style:none;display:grid;gap:2px}
#app .cd-refs button{display:flex;align-items:center;gap:8px;width:100%;padding:6px 8px;margin:0 -8px;border-radius:8px;color:var(--cd-verm);font-weight:600;line-height:1.3}
#app .cd-refs button:hover{background:var(--cd-verm-fundo)}
#app .cd-refs .ic{width:14px;height:14px}
#app .cd-nota-vazia{display:none;flex:1;place-items:center;align-content:center;gap:8px;padding:40px;text-align:center;color:var(--cd-suave)}
#app .cd-nota-vazia b{font:600 24px/1.2 var(--cd-serif);color:var(--cd-tinta)}
#app .cd-nota-vazia svg{width:120px;height:auto;margin-bottom:8px}
#app[data-sem-nota] .cd-nota-vazia{display:grid}
#app[data-sem-nota] .cd-editor,#app[data-sem-nota] .cd-leitor{display:none!important}
#app[data-sem-nota] .cd-nota-acoes>*{visibility:hidden}

/* paleta de comando (estado 3) */
#app .cd-paleta{position:absolute;inset:0;z-index:40;display:none;align-items:flex-start;justify-content:center;padding:clamp(20px,9%,92px) 20px 20px;background:var(--cd-vela);-webkit-backdrop-filter:blur(5px) saturate(.9);backdrop-filter:blur(5px) saturate(.9)}
#app[data-estado="3"] .cd-paleta{display:flex}
#app .cd-pn{display:flex;flex-direction:column;width:min(720px,100%);max-height:100%;background:var(--cd-papel);border:1px solid var(--cd-fio-forte);border-radius:20px;box-shadow:var(--cd-sombra);overflow:hidden}
#app .cd-pn-cab{display:flex;align-items:center;gap:12px;padding:6px 18px 6px 20px;border-bottom:1px solid var(--cd-fio);color:var(--cd-leve)}
#app .cd-pn-cab .ic{width:22px;height:22px;color:var(--cd-verm)}
#app .cd-pn-cab input{flex:1;min-width:0;height:60px;border:0;outline:0;background:none;font:500 22px/1 var(--cd-serif);letter-spacing:-.01em;color:var(--cd-tinta)}
#app .cd-pn-cab input::placeholder{color:var(--cd-leve);opacity:.85}
#app .cd-pn-cab .cd-limpar{display:grid;place-items:center;width:28px;height:28px;border-radius:50%;background:var(--cd-sel);color:var(--cd-suave)}
#app .cd-pn-cab .cd-limpar .ic{width:13px;height:13px;color:inherit}
#app .cd-pn-filtros{display:flex;gap:6px;padding:10px 20px;overflow-x:auto;border-bottom:1px solid var(--cd-fio);scrollbar-width:none}
#app .cd-pn-filtros::-webkit-scrollbar{display:none}
#app .cd-chip{flex:none;height:30px;padding:0 13px;border-radius:99px;border:1px solid var(--cd-fio-forte);color:var(--cd-suave);font-weight:600;font-size:12.5px;white-space:nowrap}
#app .cd-chip:hover{color:var(--cd-tinta);border-color:var(--cd-leve)}
#app .cd-chip[aria-pressed=true]{background:var(--cd-verm-fundo);border-color:var(--cd-verm);color:var(--cd-verm)}
#app .cd-pn-lista{flex:1;min-height:0;overflow:auto;margin:0;padding:6px 10px 12px;list-style:none;scrollbar-width:thin;scrollbar-color:var(--cd-fio-forte) transparent}
#app .cd-pn-rotulo{margin:14px 10px 4px;font:700 10.5px/1 var(--cd-sans);letter-spacing:.15em;text-transform:uppercase;color:var(--cd-leve)}
#app .cd-op{position:relative;display:grid;grid-template-columns:36px minmax(0,1fr) auto;gap:2px 14px;align-items:start;padding:11px 14px 11px 12px;border-radius:13px;cursor:pointer}
#app .cd-op[aria-selected=true]{background:var(--cd-verm-fundo)}
#app .cd-op[aria-selected=true]::before{content:"";position:absolute;left:0;top:12px;bottom:12px;width:3px;border-radius:0 3px 3px 0;background:var(--cd-verm)}
#app .cd-op-ic{grid-row:span 3;display:grid;place-items:center;width:36px;height:36px;border-radius:10px;background:color-mix(in srgb,var(--cor,var(--cd-leve)) 15%,transparent);color:var(--cor,var(--cd-suave))}
#app .cd-op-t{font:600 17px/1.3 var(--cd-serif);letter-spacing:-.005em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#app .cd-op-m{grid-column:2;display:flex;align-items:center;gap:8px;font-size:12px;color:var(--cd-leve)}
#app .cd-op-m i{width:3px;height:3px;border-radius:50%;background:currentColor;opacity:.6}
#app .cd-op-s{grid-column:2;margin-top:3px;font-size:13.5px;line-height:1.5;color:var(--cd-suave);display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;overflow:hidden}
#app .cd-op-k{grid-row:1;grid-column:3;align-self:center;opacity:0}
#app .cd-op[aria-selected=true] .cd-op-k{opacity:1}
#app .cd-op.acao{grid-template-columns:36px minmax(0,1fr) auto;align-items:center}
#app .cd-op.acao .cd-op-ic{grid-row:span 1}
#app .cd-op.acao .cd-op-t{font:600 14.5px/1.3 var(--cd-sans)}
#app mark{background:var(--cd-marca);color:inherit;border-radius:4px;padding:0 2px;margin:0 -1px;-webkit-box-decoration-break:clone;box-decoration-break:clone}
#app .cd-pn-vazio{display:grid;place-items:center;gap:6px;padding:40px 24px 44px;text-align:center;color:var(--cd-suave)}
#app .cd-pn-vazio b{font:600 20px/1.2 var(--cd-serif);color:var(--cd-tinta)}
#app .cd-pn-pe{display:flex;flex-wrap:wrap;align-items:center;gap:6px 18px;padding:11px 20px;border-top:1px solid var(--cd-fio);background:var(--cd-lista);font-size:12px;color:var(--cd-leve)}
#app .cd-pn-pe span{display:inline-flex;align-items:center;gap:6px}
#app .cd-pn-pe .cd-contagem{margin-left:auto;font-variant-numeric:tabular-nums}

/* aviso */
#app .cd-aviso{position:absolute;left:50%;bottom:26px;z-index:60;display:flex;align-items:center;gap:14px;max-width:calc(100% - 32px);padding:11px 14px 11px 18px;border-radius:14px;background:var(--cd-tinta);color:var(--cd-papel);
  font-weight:550;box-shadow:var(--cd-sombra);transform:translate(-50%,24px);opacity:0;pointer-events:none}
#app .cd-aviso[data-aberto=true]{transform:translate(-50%,0);opacity:1;pointer-events:auto}
#app .cd-aviso button{height:28px;padding:0 10px;border-radius:8px;color:#ecb23a;font-weight:700}
:root[data-tema=escuro] #app .cd-aviso button{color:var(--cd-verm)}
#app .cd-aviso button:hover{background:rgba(255,255,255,.12)}
#app .cd-vela{display:none}

/* telas médias: lateral e lista mais enxutas */
@container app (max-width: 1120px){
  #app .cd-buscar kbd{display:none}
  #app .cd-lista-topo h2{font-size:24px;white-space:nowrap}
  #app .cd-lista-topo{padding-left:18px;padding-right:14px}
  #app .cd-quadro{grid-template-columns:212px 300px minmax(0,1fr)}
  #app[data-vista=ler] .cd-quadro{grid-template-columns:212px minmax(0,1fr)}
  #app .cd-cab{padding-left:44px;padding-right:32px}
  #app .cd-texto{padding-left:44px;padding-right:32px;background-image:linear-gradient(to right,transparent 31px,var(--cd-margem) 31px,var(--cd-margem) 32px,transparent 32px),linear-gradient(to bottom,transparent 24px,var(--cd-pauta) 24px,var(--cd-pauta) 25px,transparent 25px)}
  #app .cd-barra{padding-left:38px;padding-right:20px}
  #app .cd-rodape{padding-left:44px}
}
@container app (max-width: 960px){
  #app[data-vista=ler] .cd-leitor{grid-template-columns:minmax(0,1fr)}
  #app .cd-trilho{display:none}
}

/* telas estreitas: lateral vira gaveta, lista e nota se alternam */
@container app (max-width: 840px){
  #app .cd-quadro,#app[data-vista=ler] .cd-quadro{display:block}
  #app .cd-lista,#app .cd-nota{position:absolute;inset:0;width:100%;height:100%;border-right:0}
  #app[data-painel=nota] .cd-lista{display:none}
  #app[data-painel=lista] .cd-nota{display:none}
  #app[data-vista=ler][data-painel=lista] .cd-lista{display:flex}
  #app .cd-lateral{position:absolute;z-index:30;top:0;bottom:0;left:0;width:min(300px,86%);padding-top:20px;box-shadow:var(--cd-sombra);transform:translateX(-104%);visibility:hidden}
  #app[data-gaveta=aberta] .cd-lateral{transform:none;visibility:visible}
  #app .cd-vela{display:block;position:absolute;inset:0;z-index:25;background:var(--cd-vela);opacity:0;pointer-events:none}
  #app[data-gaveta=aberta] .cd-vela{opacity:1;pointer-events:auto}
  #app .cd-fechar-gaveta{display:grid}
  #app .cd-menu{display:grid}
  #app .cd-so-celular{display:inline-grid}
  #app .cd-lista-topo{padding:16px 16px 10px 18px;align-items:center}
  #app .cd-lista-topo h2{font-size:24px}
  #app .cd-lista-topo p{margin-top:2px}
  #app .cd-itens{padding:0 8px 96px}
  #app .cd-fab{position:absolute;right:18px;bottom:22px;z-index:10;display:flex;align-items:center;gap:8px;height:50px;padding:0 20px 0 16px;border-radius:99px;background:var(--cd-verm);color:var(--cd-sobre);font-weight:650;box-shadow:0 12px 24px -8px var(--cd-verm),0 2px 4px rgba(0,0,0,.2)}
  #app[data-painel=nota] .cd-voltar{display:inline-flex}
  #app .cd-nota-topo{height:54px;padding:0 10px 0 16px;gap:4px}
  #app .cd-trilha{display:none}
  #app .cd-nota-acoes{margin-left:auto}
  #app .cd-modos{margin-right:2px}
  #app .cd-modos button{padding:0 11px}
  #app .cd-icone{width:34px;height:34px}
  #app .cd-cab{padding:20px 22px 4px 32px}
  #app .cd-titulo{font-size:27px}
  #app .cd-meta{margin-top:10px}
  #app .cd-barra{order:3;margin:0;padding:6px 10px;border-top:1px solid var(--cd-fio-forte);border-bottom:0}
  #app .cd-texto{order:2;padding:12px 20px 40px 32px;font-size:14.5px;background-image:linear-gradient(to right,transparent 19px,var(--cd-margem) 19px,var(--cd-margem) 20px,transparent 20px),linear-gradient(to bottom,transparent 24px,var(--cd-pauta) 24px,var(--cd-pauta) 25px,transparent 25px)}
  #app .cd-rodape{order:4;padding:0 16px 0 32px;height:34px}
  #app .cd-rodape .cd-md,#app .cd-so-largo{display:none}
  #app .cd-folha{padding:34px 24px 100px}
  #app .cd-folha h1{font-size:36px}
  #app .cd-prosa{font-size:17.5px;line-height:1.75}
  #app .cd-prosa h1,#app .cd-prosa h2{font-size:25px}
  #app .cd-paleta{padding:0}
  #app .cd-pn{width:100%;height:100%;border-radius:0;border:0}
  #app .cd-pn-cab{padding-left:16px}
  #app .cd-pn-cab input{height:56px;font-size:20px}
  #app .cd-pn-pe .dica-teclado{display:none}
  #app .cd-pn-pe .cd-contagem{margin-left:0}
  #app .cd-aviso{bottom:88px}
}
@container app (max-width: 420px){
  #app .cd-modos button span{display:none}
  #app .cd-modos button{padding:0 10px}
  #app .cd-so-ler{display:none!important}
  #app .cd-op{grid-template-columns:34px minmax(0,1fr);padding-right:10px}
  #app .cd-op-k{display:none}
  #app .cd-op-t{font-size:16px}
  #app .cd-titulo{font-size:25px}
  #app .cd-folha h1{font-size:33px}
}

@media (prefers-reduced-motion:no-preference){
  #app .cd-item,#app .cd-cartao,#app .cd-icone,#app .cd-barra button,#app .cd-modos button,#app .cd-chip,#app .cd-nova,#app .cd-buscar,#app .cd-etq,#app .cd-refs button,#app .cd-ordem{transition:background-color .16s ease,color .16s ease,border-color .16s ease,box-shadow .16s ease}
  #app .cd-tarefa input,#app .cd-tarefa input::after{transition:background-color .18s ease,border-color .18s ease,transform .22s cubic-bezier(.3,1.5,.5,1),opacity .15s ease}
  #app .cd-progresso i{transition:width .35s ease}
  #app .cd-lateral{transition:transform .26s cubic-bezier(.2,.8,.2,1),visibility 0s linear .26s}
  #app[data-gaveta=aberta] .cd-lateral{transition:transform .26s cubic-bezier(.2,.8,.2,1)}
  #app .cd-vela{transition:opacity .24s ease}
  #app .cd-aviso{transition:transform .26s cubic-bezier(.2,.9,.3,1.2),opacity .2s ease}
  #app[data-estado="3"] .cd-paleta{animation:cd-paleta-fundo .18s ease-out}
  #app[data-estado="3"] .cd-pn{animation:cd-paleta-sobe .24s cubic-bezier(.2,.9,.3,1)}
  #app[data-vista=ler] .cd-folha{animation:cd-folha-entra .32s ease-out}
  @keyframes cd-paleta-fundo{from{opacity:0}to{opacity:1}}
  @keyframes cd-paleta-sobe{from{opacity:0;transform:translateY(-10px) scale(.985)}to{opacity:1;transform:none}}
  @keyframes cd-folha-entra{from{opacity:.0;transform:translateY(6px)}to{opacity:1;transform:none}}
}
</style>
</head>
<body>
<main id="app" data-estado="1" data-vista="editar" data-painel="nota">
  <svg class="cd-sprite" aria-hidden="true" focusable="false"><defs>
    <symbol id="i-busca" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></symbol>
    <symbol id="i-mais" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="i-notas" viewBox="0 0 24 24"><path d="M7 3.5h10a1.5 1.5 0 011.5 1.5v14a1.5 1.5 0 01-1.5 1.5H7A1.5 1.5 0 015.5 19V5A1.5 1.5 0 017 3.5z"/><path d="M9 8.5h6M9 12h6M9 15.5h3.5"/></symbol>
    <symbol id="i-livro" viewBox="0 0 24 24"><path d="M6.5 3.5H18a1 1 0 011 1v14a1 1 0 01-1 1H6.5A1.5 1.5 0 015 18V5a1.5 1.5 0 011.5-1.5z"/><path d="M5 18a1.5 1.5 0 011.5-1.5H19"/><path d="M9 7.5h6"/></symbol>
    <symbol id="i-lixeira" viewBox="0 0 24 24"><path d="M4.5 7h15M9.5 7V4.5h5V7M6.5 7l.9 12.2a1.5 1.5 0 001.5 1.3h6.2a1.5 1.5 0 001.5-1.3L17.5 7M10 11v6M14 11v6"/></symbol>
    <symbol id="i-fixar" viewBox="0 0 24 24"><path d="M9 3.5h6l-1 5.2 3 3.3H7l3-3.3z"/><path d="M12 12v8.5"/></symbol>
    <symbol id="i-voltar" viewBox="0 0 24 24"><path d="M14.5 5.5L8 12l6.5 6.5"/></symbol>
    <symbol id="i-direita" viewBox="0 0 24 24"><path d="M9.5 5.5L16 12l-6.5 6.5"/></symbol>
    <symbol id="i-baixo" viewBox="0 0 24 24"><path d="M6 9.5l6 6 6-6"/></symbol>
    <symbol id="i-menu" viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h10"/></symbol>
    <symbol id="i-fechar" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></symbol>
    <symbol id="i-caneta" viewBox="0 0 24 24"><path d="M4 20l1-4.5L16.8 3.7a1.8 1.8 0 012.5 0l1 1a1.8 1.8 0 010 2.5L8.5 19z"/><path d="M14.5 6l3.5 3.5"/></symbol>
    <symbol id="i-olho" viewBox="0 0 24 24"><path d="M2.5 12S6 5.5 12 5.5 21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12z"/><circle cx="12" cy="12" r="2.8"/></symbol>
    <symbol id="i-lista" viewBox="0 0 24 24"><path d="M9.5 7H20M9.5 12H20M9.5 17H20"/><circle cx="4.8" cy="7" r=".9"/><circle cx="4.8" cy="12" r=".9"/><circle cx="4.8" cy="17" r=".9"/></symbol>
    <symbol id="i-numerada" viewBox="0 0 24 24"><path d="M10 7h10M10 12h10M10 17h10M4.5 5.5l1.5-1v4M4.3 14.2c.4-1 2.2-.9 2.2.2 0 1.2-2.2 1.6-2.2 3.1h2.4"/></symbol>
    <symbol id="i-tarefa" viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="4"/><path d="M8.5 12.3l2.5 2.5 4.6-5"/></symbol>
    <symbol id="i-citacao" viewBox="0 0 24 24"><path d="M9.5 7.5C6.5 8 5 10 5 13v3.5h4.5V12H7c.2-1.6 1-2.4 2.5-2.7zM19 7.5c-3 .5-4.5 2.5-4.5 5.5v3.5H19V12h-2.5c.2-1.6 1-2.4 2.5-2.7z"/></symbol>
    <symbol id="i-codigo" viewBox="0 0 24 24"><path d="M8.5 7.5L4 12l4.5 4.5M15.5 7.5L20 12l-4.5 4.5M13.2 5.5l-2.4 13"/></symbol>
    <symbol id="i-link" viewBox="0 0 24 24"><path d="M10 14a4 4 0 005.7 0l3-3a4 4 0 00-5.7-5.7l-1 1"/><path d="M14 10a4 4 0 00-5.7 0l-3 3a4 4 0 005.7 5.7l1-1"/></symbol>
    <symbol id="i-divisor" viewBox="0 0 24 24"><path d="M4 12h16"/><path d="M8 7l4-3 4 3M8 17l4 3 4-3" opacity=".55"/></symbol>
    <symbol id="i-ordenar" viewBox="0 0 24 24"><path d="M7 5v14M7 19l-3-3M7 19l3-3M17 19V5M17 5l-3 3M17 5l3 3"/></symbol>
    <symbol id="i-enter" viewBox="0 0 24 24"><path d="M19 6v6a2 2 0 01-2 2H6M9.5 10.5L6 14l3.5 3.5"/></symbol>
    <symbol id="i-bolt" viewBox="0 0 24 24"><path d="M13 3.5L5.5 13.5H11l-1 7 7.5-10H12z"/></symbol>
    <symbol id="i-restaurar" viewBox="0 0 24 24"><path d="M4.5 12a7.5 7.5 0 107.5-7.5A7.5 7.5 0 006.2 7"/><path d="M4.5 4v3.5H8"/></symbol>
  </defs></svg>

  <div class="cd-quadro">
    <aside class="cd-lateral" id="cd-lateral" aria-label="Cadernos e etiquetas">
      <div class="cd-marca">
        <svg viewBox="0 0 28 28" width="30" height="30" aria-hidden="true"><rect class="cd-fundo" x="3" y="1.5" width="22" height="25" rx="5.5"/><path d="M9.5 1.5v25" stroke="rgba(255,248,239,.35)" stroke-width="1.2"/><path class="cd-traco" d="M14 8.5h6M14 12.5h6" stroke-width="1.7" stroke-linecap="round"/><path class="cd-fita" d="M17 19.5v7l2.2-1.7 2.2 1.7v-7z"/></svg>
        <b>Caderno</b>
        <button class="cd-fechar-gaveta" type="button" data-acao="fechar-gaveta" aria-label="Fechar o menu"><svg class="ic"><use href="#i-fechar"/></svg></button>
      </div>
      <button class="cd-nova" type="button" data-acao="nova"><svg class="ic"><use href="#i-mais"/></svg>Nova nota</button>
      <button class="cd-buscar" type="button" data-acao="buscar" aria-label="Buscar em todas as notas"><svg class="ic"><use href="#i-busca"/></svg><span>Buscar em tudo</span><kbd id="cd-atalho">Ctrl K</kbd></button>
      <nav class="cd-nav" id="cd-nav" aria-label="Cadernos e etiquetas"></nav>
      <div class="cd-pe">
        <span class="cd-avatar" aria-hidden="true">M</span>
        <div><b>Marina Couto</b><small><i></i>Sincronizado agora</small></div>
      </div>
    </aside>

    <section class="cd-lista" id="cd-lista" aria-label="Lista de notas">
      <header class="cd-lista-topo">
        <button class="cd-menu" type="button" data-acao="gaveta" aria-label="Abrir cadernos e etiquetas"><svg class="ic"><use href="#i-menu"/></svg></button>
        <div><h2 id="cd-lista-titulo">Todas as notas</h2><p id="cd-lista-sub"></p></div>
        <button class="cd-ordem" type="button" data-acao="ordem" id="cd-ordem" title="Alternar a ordem da lista"><svg class="ic p"><use href="#i-ordenar"/></svg><span>Recentes</span></button>
        <button class="cd-icone cd-so-celular" type="button" data-acao="buscar" aria-label="Buscar em todas as notas"><svg class="ic"><use href="#i-busca"/></svg></button>
      </header>
      <ul class="cd-itens" id="cd-itens"></ul>
      <button class="cd-fab" type="button" data-acao="nova"><svg class="ic"><use href="#i-mais"/></svg>Nova nota</button>
    </section>

    <section class="cd-nota" id="cd-nota" aria-label="Nota aberta">
      <header class="cd-nota-topo">
        <button class="cd-voltar" type="button" data-acao="lista" aria-label="Voltar para a lista de notas"><svg class="ic"><use href="#i-voltar"/></svg>Notas</button>
        <nav class="cd-trilha" id="cd-trilha" aria-label="Local da nota"></nav>
        <div class="cd-nota-acoes">
          <div class="cd-modos" role="group" aria-label="Modo da nota">
            <button type="button" data-modo="editar" aria-pressed="true" aria-label="Editar"><svg class="ic p"><use href="#i-caneta"/></svg><span>Editar</span></button>
            <button type="button" data-modo="ler" aria-pressed="false" aria-label="Ler"><svg class="ic p"><use href="#i-olho"/></svg><span>Ler</span></button>

    if (alvo && alvo !== app && app.contains(alvo) && (/^(BUTTON|A)$/.test(alvo.tagName) || alvo.hasAttribute("role") || alvo.closest("[data-teclas]"))) return;
    if (document.querySelector(".stand-gaveta[open]")) return;
    if (e.key === "1" || e.key === "2" || e.key === "3") { irPara(+e.key); }
  });
  window.addEventListener("hashchange", function () {
    var m = /(?:^#|&)tema=(claro|escuro)/.exec(location.hash);
    if (m) raiz.setAttribute("data-tema", m[1]);
  });

  // ── gavetas ──────────────────────────────────────────────────────────────
  function gaveta(titulo, olhoTxt) {
    var d = el("dialog", "stand-gaveta");
    var topo = el("div", "stand-g-topo");
    var t = el("div");
    t.append(el("span", "stand-olho", olhoTxt), el("h2", null, titulo));
    var fechar = acao("Fechar", ICONE.fechar, function () { d.close(); }, true);
    topo.append(t, fechar);
    var corpo = el("div", "stand-g-corpo");
    d.append(topo, corpo);
    d.addEventListener("click", function (e) { if (e.target === d) d.close(); });
    d.addEventListener("close", function () { d.remove(); });
    document.body.appendChild(d);
    return {d: d, corpo: corpo};
  }
  function secao(corpo, titulo) { corpo.appendChild(el("h3", null, titulo)); }

  function abrirFicha() {
    var g = gaveta(ficha.nome || document.title, "Ficha técnica");
    var c = g.corpo;
    if (ficha.resumo) c.appendChild(el("p", "stand-resumo", ficha.resumo));
    var chips = el("div", "stand-chips");
    [ficha.tipo, ficha.colecao === "casa" ? "Conceito da casa" : "Referência de mercado",
      ficha.origem ? "Origem: " + ficha.origem : null, ficha.proposta ? "Proposta: " + ficha.proposta : null]
      .filter(Boolean).forEach(function (t) { chips.appendChild(el("span", "stand-chip", t)); });
    c.appendChild(chips);
    if (Array.isArray(ficha.referencias) && ficha.referencias.length) {
      secao(c, "Na linha de");
      var r = el("div", "stand-chips");
      ficha.referencias.forEach(function (ref) {
        var chip = el("span", "stand-chip", ref.nome);
        chip.appendChild(el("small", null, [ref.modelo, ref.licenca].filter(Boolean).join(" · ")));
        r.appendChild(chip);
      });
      c.appendChild(r);
      c.appendChild(el("p", "stand-nota", "Maquete original, desenhada do zero na mesma categoria. Nenhum código, marca ou imagem desses produtos foi copiado."));
    }
    if (ficha.proposta || ficha.modelo_negocio) {
      secao(c, "Modelo proposto" + (ficha.proposta ? " · " + ficha.proposta : ""));
      if (ficha.modelo_negocio) c.appendChild(el("p", null, ficha.modelo_negocio));
      c.appendChild(el("p", "stand-nota", "Hipótese para discutir, não decisão comercial."));
    }
    if (ficha.direcao) { secao(c, "Direção visual"); c.appendChild(el("p", null, ficha.direcao)); }
    secao(c, "Os três estados");
    var ul = el("ol", "stand-lista-estados");
    estados.slice(0, 3).forEach(function (e, i) {
      var li = el("li");
      li.append(el("b", null, String(i + 1)), el("strong", null, e.nome || ""), el("span", null, e.descricao || ""));
      ul.appendChild(li);
    });
    c.appendChild(ul);
    if (Array.isArray(ficha.paleta) && ficha.paleta.length) {
      secao(c, "Paleta");
      var p = el("div", "stand-paleta");
      ficha.paleta.forEach(function (cor) {
        var box = el("div", "stand-cor");
        var i = el("i"); i.style.background = cor.hex;
        var s = el("span", null, cor.nome || ""); s.appendChild(document.createElement("br"));
        s.appendChild(el("code", null, cor.hex));
        box.append(i, s); p.appendChild(box);
      });
      c.appendChild(p);
    }
    if (ficha.tipografia) { secao(c, "Tipografia"); c.appendChild(el("p", null, ficha.tipografia)); }
    if (Array.isArray(ficha.componentes) && ficha.componentes.length) {
      secao(c, "Peças da tela");
      var k = el("div", "stand-chips");
      ficha.componentes.forEach(function (t) { k.appendChild(el("span", "stand-chip", t)); });
      c.appendChild(k);
    }
    if (Array.isArray(ficha.replicar) && ficha.replicar.length) {
      secao(c, "Para virar produto");
      var ol = el("ol", "stand-passos");
      ficha.replicar.forEach(function (t) { ol.appendChild(el("li", null, t)); });
      c.appendChild(ol);
    }
    if (comTelaCheia) {
      // para as sócias: o que o botão faz e como guardar o app no iPhone
      secao(c, "Em tela cheia");
      c.appendChild(el("p", null, "O botão Tela cheia abre o app sozinho numa aba nova, sem o stand, do jeito que ele rodaria num iPhone."));
      c.appendChild(el("p", "stand-nota", "No iPhone, toque em Compartilhar e depois em “Adicionar à Tela de Início”. O app ganha um ícone e abre como aplicativo."));
      var bTela = acao("Abrir em tela cheia", ICONE.expandir, telaCheia);
      bTela.classList.add("stand-primario");
      c.appendChild(bTela);
    }
    secao(c, "Atalhos");
    c.appendChild(el("p", "stand-nota", "Teclas 1, 2 e 3 trocam o estado. O botão Código entrega o app sem o stand: um arquivo HTML só, que abre sozinho no navegador."));
    g.d.showModal();
  }

  // o código limpo: o DOM capturado antes do app rodar, sem os blocos do stand, com o script do app de volta
  function fonte() {
    var bruto = window.__standFonte || "";
    var scriptApp = document.getElementById("app-script");
    // a captura acontece de dentro do próprio bloco "captura": o fim dele e tudo que vem depois ainda não existiam.
    // \x3c no lugar de "<": este script vive inline, e a abertura de comentário HTML ou a tag de script escritas
    // por extenso (mesmo num comentário JS) fariam o parser HTML fechar ou engolir o bloco.
    var LT = "\x3c";
    var s = bruto
      .replace(/\x3c!-- stand:captura:inicio -->[\s\S]*?(?=\x3c\/body>)/, "")
      .replace(/\x3c!-- stand:([a-z]+):inicio -->[\s\S]*?\x3c!-- stand:\1:fim -->/g, "")
      .replace(/\x3cscript type="application\/json" id="maquete-ficha">[\s\S]*?\x3c\/script>/, "")
      .replace(/\x3ctemplate id="maquete-miniatura">[\s\S]*?\x3c\/template>/, "")
      .replace(/\x3chtml([^>]*)>/, function (_, a) { return LT + "html" + a.replace(/\s+data-(tema|portal)(="[^"]*")?/g, "") + ' data-tema="claro">'; })
      .replace(/\x3c\/head>/, LT + "style>html,body{margin:0}" + LT + "/style>\n" + LT + "script>document.documentElement.dataset.tema = matchMedia(\"(prefers-color-scheme: dark)\").matches ? \"escuro\" : \"claro\";" + LT + "/script>\n" + LT + "/head>");
    if (scriptApp) s = s.replace(/\x3c\/body>/, function () { return LT + "script>" + scriptApp.textContent + LT + "/script>\n" + LT + "/body>"; });
    return s.replace(/[ \t]+\n/g, "\n").replace(/\n{3,}/g, "\n\n");
  }

  function abrirCodigo() {
    var g = gaveta("Código do app", "Sem o stand · HTML único");
    var c = g.corpo;
    var texto = fonte();
    var barraC = el("div", "stand-codigo-barra");
    var aviso = el("span", "stand-nota", Math.round(texto.length / 1024) + " KB · CSS e JS embutidos");
    var area = el("textarea", "stand-codigo");
    area.readOnly = true; area.spellcheck = false; area.value = texto;
    area.setAttribute("aria-label", "Código HTML do app");
    var copiar = acao("Copiar tudo", ICONE.copiar, function () {
      var feito = function (ok) { aviso.textContent = ok ? "Copiado." : "Selecionado: use ⌘C para copiar."; };
      area.focus(); area.select();
      // na moldura do portal a Clipboard API é barrada pela política de permissões: vai direto ao execCommand
      if (!noPortal && navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(texto).then(function () { feito(true); }, function () { var ok = false; try { ok = document.execCommand("copy"); } catch (e) {} feito(ok); });
      } else { var ok = false; try { ok = document.execCommand("copy"); } catch (e) {} feito(ok); }
    });
    copiar.classList.add("stand-primario");
    barraC.appendChild(copiar);
    if (!noPortal) {
      barraC.appendChild(acao("Baixar .html", ICONE.baixar, function () {
        var a = el("a");
        a.href = URL.createObjectURL(new Blob([texto], {type: "text/html"}));
        a.download = (ficha.id || "maquete") + ".html";
        document.body.appendChild(a); a.click();
        setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
      }));
    }
    barraC.appendChild(aviso);
    c.append(barraC, area);
    g.d.showModal();
    area.scrollTop = 0;
  }

  // para as ferramentas (fotografar.mjs) e para quem inspeciona no console
  window.Stand = {irPara: irPara, tela: tela, fonte: fonte, ficha: ficha};
})();
</script>
<!-- stand:roteiro:fim -->
