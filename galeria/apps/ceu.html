<!-- stand:tema:inicio -->
<script>
// Stand · tema. Roda no <head>, antes da primeira pintura: o portal manda o tema no fragmento (#tema=claro|escuro);
// aberto sozinho, segue o sistema. Nada de storage: dentro da moldura do portal (sandbox sem mesma origem) ele lança.
(function () {
  var m = /(?:^#|&)tema=(claro|escuro)/.exec(location.hash);
  var escuro = window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches;
  document.documentElement.setAttribute("data-tema", m ? m[1] : (escuro ? "escuro" : "claro"));
  if (m) document.documentElement.setAttribute("data-portal", "");
})();
</script>

<style>
/* Stand · estilo. A moldura de cada maquete: barra de estados, palco (tela ampla ou celular), ficha e código.
   Tudo com prefixo stand- e variáveis --st-*: o app de dentro tem as próprias e não deve sentir o stand. */
:root{--st-fundo:#f4f3ee;--st-papel:#fff;--st-tinta:#15211a;--st-suave:#5a655e;--st-fio:rgba(21,33,26,.10);--st-fio-forte:rgba(21,33,26,.18);
  --st-ouro:#8d6d26;--st-ouro-forma:#cfac69;--st-tingido:rgba(21,33,26,.05);--st-tingido-forte:rgba(21,33,26,.09);

  --st-serif:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,serif;

:root[data-tema=escuro]{--st-fundo:#10110f;--st-papel:#191a17;--st-tinta:#f0ebdf;--st-suave:#aaa69d;--st-fio:rgba(240,235,223,.10);--st-fio-forte:rgba(240,235,223,.2);
  --st-ouro:#ead3a3;--st-ouro-forma:#cfac69;--st-tingido:rgba(240,235,223,.06);--st-tingido-forte:rgba(240,235,223,.11);

html,body{margin:0}
body.stand-corpo{background:var(--st-fundo);min-height:100vh}
.stand-barra,.stand-barra *,.stand-gaveta,.stand-gaveta *,.stand-pilula{box-sizing:border-box}
.stand-barra{position:sticky;top:0;z-index:2147483000;display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;padding:9px 16px;
  background:var(--st-vidro);border-bottom:1px solid var(--st-fio);backdrop-filter:blur(18px) saturate(1.5);-webkit-backdrop-filter:blur(18px) saturate(1.5);
  font:500 13px/1.3 var(--st-sans);color:var(--st-tinta);-webkit-font-smoothing:antialiased}
.stand-barra button,.stand-gaveta button,.stand-pilula{font:inherit;color:inherit;cursor:pointer;border:0;background:none;margin:0}
.stand-barra :focus-visible,.stand-gaveta :focus-visible,.stand-pilula:focus-visible{outline:2px solid var(--st-ouro-forma);outline-offset:2px}
.stand-voltar{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 12px;border-radius:10px;background:var(--st-tingido);font-weight:600;white-space:nowrap}

.stand-id{display:flex;flex-direction:column;min-width:0;margin-right:auto}

.stand-estados{display:flex;gap:4px;padding:3px;border-radius:12px;background:var(--st-tingido);overflow-x:auto;scrollbar-width:none;max-width:100%}
.stand-estados::-webkit-scrollbar{display:none}
.stand-estado{display:inline-flex;align-items:center;gap:8px;height:32px;padding:0 12px 0 6px;border-radius:9px;white-space:nowrap;color:var(--st-suave)}

.stand-pilula{position:fixed;top:10px;right:10px;z-index:2147483000;display:none;align-items:center;gap:6px;height:32px;padding:0 12px;border-radius:999px;

#app{container:app / inline-size;display:flex;flex-direction:column;position:relative;isolation:isolate;color:var(--tx);
  font:400 15px/1.45 var(--fonte);letter-spacing:-.003em;-webkit-font-smoothing:antialiased;
  background:linear-gradient(180deg,var(--c1) 0%,var(--c2) 55%,var(--c3) 100%);
  transition:--c1 1.1s ease,--c2 1.1s ease,--c3 1.1s ease}
#app *{box-sizing:border-box}
#app button{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;cursor:pointer;text-align:inherit;-webkit-tap-highlight-color:transparent}
#app h1,#app h2,#app h3,#app h4,#app p,#app ol,#app ul,#app dl,#app dd,#app figure{margin:0;padding:0}
#app ol,#app ul{list-style:none}
#app :focus-visible{outline:2.5px solid var(--tx);outline-offset:3px;border-radius:10px}
#app .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
#app .c-sprite{position:absolute;width:0;height:0;overflow:hidden}
#app .i{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;display:block}
#app .i16{width:16px;height:16px}#app .i18{width:18px;height:18px}#app .i22{width:22px;height:22px}#app .i24{width:24px;height:24px}

/* ───── o céu (camada decorativa) ───── */
#app .c-ceu{position:sticky;top:0;height:0;z-index:0;pointer-events:none}
#app .c-ceu-in{position:absolute;top:0;left:0;right:0;height:100vh;max-height:920px;overflow:hidden;--ox:50%;--oy:30%}
#app .c-orbe{position:absolute;left:var(--ox);top:var(--oy);width:210px;height:210px;margin:-105px 0 0 -105px;border-radius:50%;
  background:radial-gradient(circle,rgba(255,250,215,.95) 0,rgba(255,236,150,.8) 9%,rgba(255,214,102,.42) 22%,rgba(255,200,90,.16) 42%,transparent 68%);
  opacity:var(--orbe-op,.95);transition:left 1.2s cubic-bezier(.3,.7,.2,1),top 1.2s cubic-bezier(.3,.7,.2,1),opacity .9s}
#app[data-orbe=lua] .c-orbe{background:radial-gradient(circle,rgba(255,253,240,.98) 0,rgba(236,240,255,.85) 8%,rgba(190,206,255,.36) 22%,rgba(170,190,255,.12) 42%,transparent 68%)}
#app[data-orbe=poente] .c-orbe{background:radial-gradient(circle,rgba(255,240,205,.98) 0,rgba(255,190,110,.85) 9%,rgba(255,140,80,.45) 24%,rgba(255,110,70,.18) 46%,transparent 70%)}
#app .c-estrelas{position:absolute;inset:0;opacity:0;transition:opacity 1s;
  background-image:radial-gradient(1.4px 1.4px at 12% 18%,#fff 98%,transparent),radial-gradient(1px 1px at 28% 8%,#fff 98%,transparent),radial-gradient(1.6px 1.6px at 44% 22%,#fff 98%,transparent),radial-gradient(1px 1px at 61% 12%,#fff 98%,transparent),radial-gradient(1.5px 1.5px at 78% 26%,#fff 98%,transparent),radial-gradient(1px 1px at 90% 10%,#fff 98%,transparent),radial-gradient(1.2px 1.2px at 20% 38%,#fff 98%,transparent),radial-gradient(1.4px 1.4px at 52% 42%,#fff 98%,transparent),radial-gradient(1px 1px at 84% 46%,#fff 98%,transparent),radial-gradient(1.2px 1.2px at 6% 52%,#fff 98%,transparent),radial-gradient(1px 1px at 68% 6%,#fff 98%,transparent)}
#app[data-estrelas="1"] .c-estrelas{opacity:.85;animation:c-brilha 5s ease-in-out infinite alternate}
@keyframes c-brilha{from{opacity:.5}to{opacity:.95}}
#app .c-nuv{position:absolute;color:#eaf3ff;opacity:0;filter:blur(.4px);transition:opacity 1s,color 1s;will-change:transform}
#app .c-nuv.n1{top:9%;width:min(86%,520px);left:-20%;animation:c-passa 120s linear -34s infinite}
#app .c-nuv.n2{top:23%;width:min(70%,430px);left:-60%;animation:c-passa 160s linear -92s infinite}
#app .c-nuv.n3{top:36%;width:min(95%,560px);left:-30%;animation:c-passa 200s linear -128s infinite}
#app .c-nuv.n4{top:15%;width:min(60%,360px);left:-70%;animation:c-passa 140s linear -70s infinite}
@keyframes c-passa{from{transform:translateX(0)}to{transform:translateX(calc(100vw + 40%))}}
#app[data-nuvens="0"] .c-nuv.n4{opacity:.22}
#app[data-nuvens="1"] .c-nuv.n1,#app[data-nuvens="1"] .c-nuv.n2,#app[data-nuvens="1"] .c-nuv.n4{opacity:.34}
#app[data-nuvens="2"] .c-nuv{opacity:.4}
#app[data-nuvens="3"] .c-nuv{opacity:.55;color:#8b9bb5}
#app[data-ceu=nublado] .c-nuv{color:#8b9bb5;opacity:.5}
#app[data-ceu=chuva] .c-nuv,#app[data-ceu=noite-chuva] .c-nuv{color:#667792;opacity:.6}
#app[data-ceu=tempestade] .c-nuv{color:#4b556d;opacity:.75}
#app[data-ceu=entardecer] .c-nuv{color:#ffcfb0;opacity:.4}
#app[data-ceu=amanhecer] .c-nuv{color:#ffd9c9;opacity:.4}
#app[data-ceu=noite] .c-nuv{color:#5a6c99;opacity:.42}
#app[data-ceu=noite-chuva] .c-nuv{color:#46556f;opacity:.7}
:root[data-tema=escuro] #app .c-nuv{filter:blur(.4px) brightness(.6)}
#app[data-ceu=alerta] .c-nuv{color:#a8541c;opacity:.32}
:root[data-tema=escuro] #app[data-ceu=alerta] .c-nuv{color:#8a4a22;opacity:.7;filter:blur(.4px) brightness(.55)}
#app .c-chuva{position:absolute;inset:0;opacity:0;transition:opacity .9s;
  background:repeating-linear-gradient(103deg,rgba(255,255,255,0) 0 18px,rgba(210,230,255,.34) 18px 19px,rgba(255,255,255,0) 19px 41px),repeating-linear-gradient(103deg,rgba(255,255,255,0) 0 31px,rgba(210,230,255,.2) 31px 32px,rgba(255,255,255,0) 32px 57px);
  background-size:300px 300px,420px 420px;animation:c-chove .9s linear infinite;-webkit-mask-image:linear-gradient(180deg,#000 0,#000 60%,transparent);mask-image:linear-gradient(180deg,#000 0,#000 60%,transparent)}
@keyframes c-chove{from{background-position:0 0,0 0}to{background-position:-48px 300px,-70px 420px}}
#app[data-chuva="1"] .c-chuva{opacity:.5}
#app[data-chuva="2"] .c-chuva{opacity:.9}
#app .c-relampago{position:absolute;inset:0;opacity:0;background:radial-gradient(60% 40% at 70% 12%,rgba(255,255,255,.55),transparent 70%)}
#app[data-tempestade="1"] .c-relampago{animation:c-relampago 7s linear infinite}
@keyframes c-relampago{0%,86%,100%{opacity:0}87%{opacity:.5}88%{opacity:.05}90%{opacity:.4}93%{opacity:0}}
#app[data-ceu=alerta] .c-orbe,#app[data-ceu=alerta] .c-estrelas{display:none}
:root[data-tema=escuro] #app[data-ceu=alerta] .c-ceu-in::after{content:"";position:absolute;inset:0;background:radial-gradient(80% 46% at 24% 0%,rgba(255,150,40,.38),transparent 72%),radial-gradient(60% 40% at 90% 10%,rgba(255,90,30,.2),transparent 70%)}

/* ───── layout ───── */
#app .c-app{--c-pad:36px;position:relative;z-index:1;flex:none;display:grid;grid-template-columns:276px minmax(0,1fr);height:var(--c-alt,calc(100vh - 54px));min-height:0;overflow:hidden}
#app .c-ceu{position:absolute;inset:0;height:auto}
#app .c-ceu-in{height:100%;max-height:none}
#app .c-vista{display:none;min-width:0;overflow:auto;padding:30px var(--c-pad) 40px;scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.3) transparent}
#app[data-estado="1"] .c-agora,#app[data-estado="2"] .c-dias,#app[data-estado="3"] .c-alerta{display:grid}
#app .c-abas{display:none}

/* lateral */
#app .c-lateral{display:flex;flex-direction:column;gap:22px;padding:26px 16px 18px;border-right:1px solid var(--borda);background:var(--vidro);backdrop-filter:blur(26px) saturate(1.3);-webkit-backdrop-filter:blur(26px) saturate(1.3);overflow:auto;scrollbar-width:none}
#app .c-marca{display:flex;align-items:center;gap:11px;padding:0 10px;font-weight:700;font-size:22px;letter-spacing:-.03em}
#app .c-marca svg{width:32px;height:32px;border-radius:10px;box-shadow:0 6px 16px rgba(0,0,0,.25)}
#app .c-nav{display:grid;gap:3px}
#app .c-nav button{display:flex;align-items:center;gap:12px;height:44px;padding:0 12px;border-radius:12px;font-weight:620;font-size:14.5px;transition:background-color .15s}
#app .c-nav button:hover{background:var(--hover)}
#app .c-nav button[aria-current=page]{background:var(--vidro2);box-shadow:inset 0 0 0 1px var(--borda)}
#app .c-nav .ponto{margin-left:auto;width:9px;height:9px;border-radius:50%;background:#ffb02e;box-shadow:0 0 0 3px rgba(255,176,46,.28)}
#app .c-lat-tit{font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;padding:0 12px 8px;color:var(--tx2)}
#app .c-cidades{display:grid;gap:6px}
#app .c-cidade{display:grid;grid-template-columns:minmax(0,1fr) auto 38px;align-items:center;gap:8px;padding:11px 12px;border-radius:16px;background:var(--vidro);border:1px solid var(--borda);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);transition:background-color .15s,transform .15s,box-shadow .15s}
#app .c-cidade:hover{background:var(--vidro2);transform:translateY(-1px)}
#app .c-cidade[aria-pressed=true]{background:var(--vidro2);box-shadow:inset 0 0 0 1.5px var(--tx)}
#app .c-cidade strong{display:block;font-size:15px;font-weight:680;letter-spacing:-.015em}
#app .c-cidade small{display:block;font-size:12.5px;color:var(--tx2)}
#app .c-cidade .tp{font-size:26px;font-weight:300;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
#app .c-cidade .wi{width:38px;height:38px}
#app .c-cidade .al{display:inline-block;width:8px;height:8px;border-radius:50%;background:#ffb02e;margin-right:6px;vertical-align:1px}
#app .c-un{display:flex;padding:3px;border-radius:12px;background:var(--vidro);border:1px solid var(--borda)}
#app .c-un button{flex:1;height:34px;border-radius:9px;text-align:center;font-weight:650;font-size:13.5px;transition:background-color .15s}
#app .c-un button[aria-pressed=true]{background:#fff;color:#12213a}
#app .c-rodape{margin-top:auto;font-size:12px;color:var(--tx2);padding:0 10px;line-height:1.5}

/* painéis em vidro */
#app .c-vidro{background:var(--vidro);border:1px solid var(--borda);border-radius:24px;backdrop-filter:blur(20px) saturate(1.35);-webkit-backdrop-filter:blur(20px) saturate(1.35);box-shadow:0 1px 0 rgba(255,255,255,.08) inset}
#app .c-rot{display:flex;align-items:center;gap:7px;font-size:11.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--tx2)}
#app .c-rot .i{width:15px;height:15px}

/* ───── ESTADO 1 · Agora ───── */
#app .c-agora{grid-template-columns:minmax(0,1fr) 352px;grid-template-areas:"topo lado" "hero lado" "banner lado" "horas lado" "cards lado";grid-template-rows:repeat(5,auto);gap:20px 28px;align-content:start}
#app .c-topo{grid-area:topo;display:flex;align-items:center;gap:10px}
#app .c-topo-cid{display:none}
#app .c-atual{margin-left:auto;font-size:13px;font-weight:600;color:var(--tx2)}
#app .c-hero{grid-area:hero;display:flex;align-items:center;gap:28px;padding:6px 0 4px}
#app .c-hero .wi{width:min(30cqi,168px);height:min(30cqi,168px);flex:none;filter:drop-shadow(0 12px 22px rgba(0,0,0,.22))}
#app .c-hero-tx{min-width:0}
#app .c-hero-chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
#app .c-cond{font-size:21px;font-weight:700;letter-spacing:-.02em;text-shadow:0 1px 12px rgba(6,24,60,.4)}
#app .c-grau{display:block;font-size:min(23cqi,148px);line-height:.95;font-weight:200;letter-spacing:-.06em;font-variant-numeric:tabular-nums;margin:2px 0 6px -.04em;text-shadow:0 2px 26px rgba(6,24,60,.32)}
#app .c-hl{display:flex;flex-wrap:wrap;align-items:center;gap:6px 16px;font-size:18px;font-weight:700;font-variant-numeric:tabular-nums;text-shadow:0 1px 10px rgba(6,24,60,.4)}
#app .c-chip{display:inline-flex;align-items:center;gap:7px;height:34px;padding:0 14px;border-radius:999px;background:var(--vidro);border:1px solid var(--borda);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);font-size:14px;font-weight:620;font-variant-numeric:tabular-nums}
#app .c-chip.hora-x{cursor:pointer;transition:background-color .15s}
#app .c-chip.hora-x:hover{background:var(--vidro2)}
#app .c-banner{grid-area:banner;display:none}
#app .c-lado{grid-area:lado;display:grid;gap:16px;align-content:start}
#app .c-faixa{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:12px;align-items:center;width:100%;padding:13px 14px;border-radius:20px;text-align:left;background:linear-gradient(135deg,rgba(255,176,46,.95),rgba(242,112,28,.95));color:#2a1100;box-shadow:0 10px 28px rgba(242,112,28,.35);transition:transform .15s}
#app .c-faixa:hover{transform:translateY(-2px)}
#app .c-faixa:active{transform:scale(.985)}
#app .c-faixa .ic{display:grid;place-items:center;width:44px;height:44px;border-radius:14px;background:rgba(42,17,0,.12)}
#app .c-faixa strong{display:block;font-size:15px;font-weight:760;letter-spacing:-.015em}
#app .c-faixa span.s{display:block;font-size:13px;font-weight:600;font-variant-numeric:tabular-nums}
#app .c-faixa .i{width:22px;height:22px}
#app .c-faixa.calma{background:var(--vidro);color:var(--tx);box-shadow:none;border:1px solid var(--borda)}
#app .c-faixa.calma .ic{background:var(--hover)}
#app .c-horas{grid-area:horas;padding:16px 0 12px}
#app .c-horas .c-rot{padding:0 18px 12px}
#app .c-horas-lista{display:flex;gap:4px;overflow-x:auto;padding:2px 12px 6px;scrollbar-width:none;scroll-snap-type:x proximity}
#app .c-horas-lista::-webkit-scrollbar{display:none}
#app .c-h{flex:none;display:grid;justify-items:center;gap:5px;width:62px;padding:10px 4px 9px;border-radius:18px;scroll-snap-align:start;text-align:center;font-variant-numeric:tabular-nums;border:1px solid transparent;transition:background-color .15s,border-color .15s}
#app .c-h:hover{background:var(--hover)}
#app .c-h[aria-pressed=true]{background:var(--hover);border-color:var(--borda);box-shadow:0 0 0 1px rgba(255,255,255,.1) inset}
#app .c-h .h{font-size:13.5px;font-weight:650}
#app .c-h .wi{width:36px;height:36px}
#app .c-h .t{font-size:18px;font-weight:700;letter-spacing:-.02em}
#app .c-h .p{font-size:12px;font-weight:700;color:var(--realce);min-height:16px}
#app .c-h.ev{width:74px;gap:6px}
#app .c-h.ev .h{font-size:12.5px}
#app .c-h.ev .t{font-size:13.5px;font-weight:700}
#app .c-h.ev .i{width:30px;height:30px;color:#ffd23f}
#app .c-cards{grid-area:cards;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;align-content:start}
#app .c-card{padding:16px 16px 15px;display:flex;flex-direction:column;gap:9px;min-height:152px;min-width:0}
#app .c-card.dobro{grid-column:span 2}
#app .c-valor{font-size:34px;font-weight:300;letter-spacing:-.04em;line-height:1;font-variant-numeric:tabular-nums}
#app .c-valor small{font-size:15px;font-weight:600;letter-spacing:0;margin-left:3px}
#app .c-card p{font-size:13.5px;line-height:1.4;color:var(--tx2);font-weight:500}
#app .c-card p b{font-weight:700;color:var(--tx)}
#app .c-uv-escala{position:relative;height:7px;border-radius:4px;background:linear-gradient(90deg,#4ec86b 0%,#f2d338 28%,#f59a2e 52%,#e8453a 76%,#9a4bd0 100%);margin:2px 0}
#app .c-uv-escala i{position:absolute;top:50%;left:var(--x);width:15px;height:15px;margin:-7.5px 0 0 -7.5px;border-radius:50%;background:#fff;box-shadow:0 0 0 3px rgba(0,0,0,.3),0 2px 6px rgba(0,0,0,.4)}
#app .c-vento-linha{display:flex;align-items:center;gap:12px}
#app .c-vento-linha .c-valor small{display:block;margin:4px 0 0}
#app .c-bussola{width:68px;height:68px;flex:none}
#app .c-bussola .seta{transform-origin:50px 50px;transition:transform 1s cubic-bezier(.3,1.3,.5,1)}
#app .c-barra{height:7px;border-radius:4px;background:rgba(255,255,255,.22);overflow:hidden}
#app .c-barra i{display:block;height:100%;width:var(--w);border-radius:inherit;background:linear-gradient(90deg,#7cc6ff,#fff);transition:width .8s cubic-bezier(.3,.9,.3,1)}
#app .c-arco{width:100%;height:auto;max-height:104px;overflow:visible}
#app .c-arco text{font-family:inherit}
#app .c-sol-linha{display:flex;justify-content:space-between;font-size:13.5px;font-weight:650;font-variant-numeric:tabular-nums}
#app .c-sol-linha span{display:grid}
#app .c-sol-linha small{font-size:11.5px;font-weight:600;color:var(--tx2)}
#app .c-mm-barras{display:flex;align-items:flex-end;gap:2px;height:34px}
#app .c-mm-barras i{flex:1;min-width:2px;border-radius:2px 2px 0 0;background:var(--realce);opacity:.9;height:max(8%,var(--h))}
#app .c-spark{width:100%;height:34px}
#app .c-trend{display:inline-flex;align-items:center;gap:4px;font-weight:700}

/* próximos dias compactos (lado do estado 1) */
#app .c-prox{padding:16px 6px 10px}
#app .c-prox .c-rot{padding:0 14px 8px}
#app .c-prox-lista{display:grid}
#app .c-prox-ver{display:flex;align-items:center;justify-content:center;gap:6px;margin:6px 10px 6px;height:42px;border-radius:14px;font-weight:650;font-size:14px;background:var(--hover);transition:background-color .15s}
#app .c-prox-ver:hover{background:var(--vidro2)}

/* linhas de dia (compartilhadas) */
#app .c-dia{width:100%;display:grid;grid-template-columns:62px 36px 52px 34px minmax(70px,1fr) 34px;align-items:center;gap:6px 10px;padding:11px 14px;border-radius:16px;text-align:left;font-variant-numeric:tabular-nums;transition:background-color .15s}
#app .c-dia:hover{background:var(--hover)}
#app .c-dia .nm{display:grid;line-height:1.2}
#app .c-dia .nm b{font-size:15.5px;font-weight:700}
#app .c-dia .nm small{font-size:12px;color:var(--tx2);font-weight:500}
#app .c-dia .wi{width:36px;height:36px}
#app .c-dia .pp{font-size:13px;font-weight:700;color:var(--realce);display:flex;align-items:center;gap:3px;min-height:18px}
#app .c-dia .pp .i{width:13px;height:13px}
#app .c-dia .mn,#app .c-dia .mx{font-size:16px;font-weight:700;text-align:right}
#app .c-dia .mn{color:var(--tx2);font-weight:600}
#app .c-faixa-temp{position:relative;height:7px;border-radius:4px;background:rgba(255,255,255,.22)}
#app .c-faixa-temp i{position:absolute;top:0;bottom:0;left:var(--a);width:var(--l);border-radius:4px;background:linear-gradient(90deg,#8fd0ff,#ffe27a 55%,#ff9f45);box-shadow:0 0 0 1px rgba(0,0,0,.12)}
#app .c-faixa-temp b{position:absolute;top:50%;left:var(--agora);width:11px;height:11px;margin:-5.5px 0 0 -5.5px;border-radius:50%;background:#fff;box-shadow:0 0 0 2.5px rgba(0,0,0,.35)}
#app .c-dia[aria-pressed=true],#app .c-dia[aria-expanded=true]{background:var(--hover)}
#app .c-dia-det{display:none;grid-column:1/-1}

/* ───── ESTADO 2 · Dias ───── */
#app .c-dias{grid-template-columns:minmax(0,1fr) 400px;grid-template-areas:"topo detalhe" "tit detalhe" "lista detalhe";grid-template-rows:repeat(3,auto);gap:18px 28px;align-content:start}
#app .c-tit h1{font-size:34px;line-height:1.05;font-weight:760;letter-spacing:-.035em}
#app .c-tit p{margin-top:8px;font-size:16px;font-weight:600;max-width:46ch;line-height:1.4}
#app .c-dias .c-topo{grid-area:topo}
#app .c-dias .c-tit{grid-area:tit}
#app .c-dias-lista{grid-area:lista;padding:10px 8px;display:grid;gap:2px;align-content:start}
#app .c-detalhe{grid-area:detalhe;align-self:start;padding:20px 20px 18px;display:grid;gap:16px;align-content:start;position:sticky;top:0}
#app .c-detalhe h2{font-size:23px;font-weight:720;letter-spacing:-.03em;line-height:1.1}
#app .c-detalhe .sub{font-size:14px;color:var(--tx2);font-weight:600;margin-top:3px}
#app .c-det-cab{display:flex;align-items:center;gap:14px}

  function linhaDia(c, i, modo) {
    var d = c.dia[i], gmin = Math.min.apply(null, c.dia.map(function (x) { return x.min; })), gmax = Math.max.apply(null, c.dia.map(function (x) { return x.max; }));

  }
  function pontosDia(c, i) {
    var d = c.dia[i], out = [];

      var base = curva(c, h + 0.5, "l", d.min, d.max), cool = 0, pop;

      else if (d.cod === "p") { cool = -0.6; pop = 5 + (h * 3) % 5; }

    }
    secao(c, "Atalhos");
    c.appendChild(el("p", "stand-nota", "Teclas 1, 2 e 3 trocam o estado. O botão Código entrega o app sem o stand: um arquivo HTML só, que abre sozinho no navegador."));
    g.d.showModal();
  }

  // o código limpo: o DOM capturado antes do app rodar, sem os blocos do stand, com o script do app de volta
  function fonte() {
    var bruto = window.__standFonte || "";
    var scriptApp = document.getElementById("app-script");
    // a captura acontece de dentro do próprio bloco "captura": o fim dele e tudo que vem depois ainda não existiam.
    // \x3c no lugar de "<": este script vive inline, e a abertura de comentário HTML ou a tag de script escritas
    // por extenso (mesmo num comentário JS) fariam o parser HTML fechar ou engolir o bloco.
    var LT = "\x3c";
    var s = bruto
      .replace(/\x3c!-- stand:captura:inicio -->[\s\S]*?(?=\x3c\/body>)/, "")
      .replace(/\x3c!-- stand:([a-z]+):inicio -->[\s\S]*?\x3c!-- stand:\1:fim -->/g, "")
      .replace(/\x3cscript type="application\/json" id="maquete-ficha">[\s\S]*?\x3c\/script>/, "")
      .replace(/\x3ctemplate id="maquete-miniatura">[\s\S]*?\x3c\/template>/, "")
      .replace(/\x3chtml([^>]*)>/, function (_, a) { return LT + "html" + a.replace(/\s+data-(tema|portal)(="[^"]*")?/g, "") + ' data-tema="claro">'; })
      .replace(/\x3c\/head>/, LT + "style>html,body{margin:0}" + LT + "/style>\n" + LT + "script>document.documentElement.dataset.tema = matchMedia(\"(prefers-color-scheme: dark)\").matches ? \"escuro\" : \"claro\";" + LT + "/script>\n" + LT + "/head>");
    if (scriptApp) s = s.replace(/\x3c\/body>/, function () { return LT + "script>" + scriptApp.textContent + LT + "/script>\n" + LT + "/body>"; });
    return s.replace(/[ \t]+\n/g, "\n").replace(/\n{3,}/g, "\n\n");
  }

  function abrirCodigo() {
    var g = gaveta("Código do app", "Sem o stand · HTML único");
    var c = g.corpo;
    var texto = fonte();
    var barraC = el("div", "stand-codigo-barra");
    var aviso = el("span", "stand-nota", Math.round(texto.length / 1024) + " KB · CSS e JS embutidos");
    var area = el("textarea", "stand-codigo");
    area.readOnly = true; area.spellcheck = false; area.value = texto;
    area.setAttribute("aria-label", "Código HTML do app");
    var copiar = acao("Copiar tudo", ICONE.copiar, function () {
      var feito = function (ok) { aviso.textContent = ok ? "Copiado." : "Selecionado: use ⌘C para copiar."; };
      area.focus(); area.select();
      // na moldura do portal a Clipboard API é barrada pela política de permissões: vai direto ao execCommand
      if (!noPortal && navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(texto).then(function () { feito(true); }, function () { var ok = false; try { ok = document.execCommand("copy"); } catch (e) {} feito(ok); });
      } else { var ok = false; try { ok = document.execCommand("copy"); } catch (e) {} feito(ok); }
    });
    copiar.classList.add("stand-primario");
    barraC.appendChild(copiar);
    if (!noPortal) {
      barraC.appendChild(acao("Baixar .html", ICONE.baixar, function () {
        var a = el("a");
        a.href = URL.createObjectURL(new Blob([texto], {type: "text/html"}));
        a.download = (ficha.id || "maquete") + ".html";
        document.body.appendChild(a); a.click();
        setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
      }));
    }
    barraC.appendChild(aviso);
    c.append(barraC, area);
    g.d.showModal();
    area.scrollTop = 0;
  }

  // para as ferramentas (fotografar.mjs) e para quem inspeciona no console
  window.Stand = {irPara: irPara, tela: tela, fonte: fonte, ficha: ficha};
})();
</script>
<!-- stand:roteiro:fim -->
