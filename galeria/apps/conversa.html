<!-- stand:tema:inicio -->
<script>
// Stand · tema. Roda no <head>, antes da primeira pintura: o portal manda o tema no fragmento (#tema=claro|escuro);
// aberto sozinho, segue o sistema. Nada de storage: dentro da moldura do portal (sandbox sem mesma origem) ele lança.
(function () {
  var m = /(?:^#|&)tema=(claro|escuro)/.exec(location.hash);
  var escuro = window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches;
  document.documentElement.setAttribute("data-tema", m ? m[1] : (escuro ? "escuro" : "claro"));
  if (m) document.documentElement.setAttribute("data-portal", "");
})();
</script>

/* quadro */
#app .cv-quadro{position:relative;display:grid;grid-template-columns:272px minmax(0,1fr);height:100%;min-height:0}
#app[data-estado="2"] .cv-quadro{grid-template-columns:272px minmax(0,1fr) 430px}
#app[data-estado="3"] .cv-canal,#app[data-estado="3"] .cv-fio{display:none}
#app[data-estado="1"] .cv-fio,#app[data-estado="1"] .cv-busca,#app[data-estado="2"] .cv-busca{display:none}
#app[data-estado="2"] .cv-fio{display:flex}
#app[data-estado="3"] .cv-busca{display:flex}

/* barra lateral */
#app .cv-lat{display:flex;flex-direction:column;min-height:0;background:var(--cv-lat);color:var(--cv-lat-txt)}
#app .cv-ws{display:flex;align-items:center;gap:12px;height:64px;padding:0 14px 0 16px;border-bottom:1px solid var(--cv-lat-fio);flex:none}
#app .cv-ws-logo{display:grid;place-items:center;width:36px;height:36px;border-radius:11px;background:linear-gradient(135deg,var(--cv-menta),#26b6d6);color:var(--cv-sobre-menta);font:800 14px/1 var(--cv-sans);letter-spacing:.02em;box-shadow:0 6px 16px -6px rgba(94,230,189,.55)}
#app .cv-ws b{display:block;font-size:15.5px;font-weight:750;letter-spacing:-.005em;line-height:1.2}
#app .cv-ws small{display:block;font-size:12px;color:var(--cv-lat-mudo);line-height:1.25}
#app .cv-ws>div{min-width:0;flex:1}
#app .cv-ws>div *{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#app .cv-ws .ic{color:var(--cv-lat-mudo)}
#app .cv-lat-busca{display:flex;align-items:center;gap:10px;height:38px;margin:14px 14px 6px;padding:0 10px 0 12px;border-radius:10px;background:rgba(255,255,255,.07);color:var(--cv-lat-suave);border:1px solid transparent;flex:none}
#app .cv-lat-busca:hover{background:rgba(255,255,255,.11);color:var(--cv-lat-txt)}
#app .cv-lat-busca span{flex:1}
#app .cv-lat-busca kbd{background:transparent;border-color:rgba(255,255,255,.2);color:var(--cv-lat-suave)}
#app .cv-lat-nav{flex:1;min-height:0;overflow:auto;padding:6px 8px 12px;scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.18) transparent}
#app .cv-lat-sec{display:flex;align-items:center;gap:6px;width:100%;height:30px;margin-top:14px;padding:0 10px;color:var(--cv-lat-mudo);font:700 11px/1 var(--cv-sans);letter-spacing:.13em;text-transform:uppercase}
#app .cv-lat-sec:hover{color:var(--cv-lat-txt)}
#app .cv-lat-sec .ic{width:13px;height:13px;transition:transform .15s ease}
#app .cv-lat-sec[aria-expanded=false] .ic{transform:rotate(-90deg)}
#app .cv-lat-item{position:relative;display:flex;align-items:center;gap:10px;width:100%;height:34px;padding:0 10px;border-radius:9px;color:var(--cv-lat-suave);font-size:14.5px;font-weight:500}
#app .cv-lat-item:hover{background:var(--cv-lat-h);color:var(--cv-lat-txt)}
#app .cv-lat-item .ic{width:17px;height:17px;opacity:.85}
#app .cv-lat-item .cv-nome{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#app .cv-lat-item.nao-lida{color:#fff;font-weight:750}
#app .cv-lat-item[aria-current=true]{background:var(--cv-lat-sel);color:#fff;font-weight:700}
#app .cv-lat-item[aria-current=true]::before{content:"";position:absolute;left:-8px;top:7px;bottom:7px;width:3px;border-radius:0 3px 3px 0;background:var(--cv-menta)}
#app .cv-lat-item[aria-current=true] .ic{color:var(--cv-menta);opacity:1}
#app .cv-badge{display:inline-grid;place-items:center;min-width:20px;height:20px;padding:0 6px;border-radius:99px;background:var(--cv-menta);color:var(--cv-sobre-menta);font:800 11.5px/1 var(--cv-sans);font-variant-numeric:tabular-nums}
#app .cv-badge.suave{background:rgba(255,255,255,.14);color:var(--cv-lat-txt)}
#app .cv-pres{position:relative;display:inline-block;flex:none;width:9px;height:9px;margin:0 4px;border-radius:50%;background:var(--cv-ok)}
#app .cv-pres.ausente{background:transparent;box-shadow:inset 0 0 0 2px var(--cv-ausente)}
#app .cv-pres.ocupado{background:var(--cv-perigo)}
#app .cv-dm-av{display:grid;place-items:center;flex:none;width:22px;height:22px;border-radius:7px;color:#fff;font:700 10px/1 var(--cv-sans);background:var(--c)}
#app .cv-dm-av .cv-pres{position:absolute;right:-3px;bottom:-3px;width:10px;height:10px;margin:0;border:2px solid var(--cv-lat)}
#app .cv-dm-av{position:relative;margin-right:2px}
#app .cv-lat-item:hover .cv-dm-av .cv-pres{border-color:var(--cv-lat-h)}
#app .cv-eu{display:flex;align-items:center;gap:12px;flex:none;padding:12px 14px;border-top:1px solid var(--cv-lat-fio);width:100%;text-align:left}
#app .cv-eu:hover{background:rgba(255,255,255,.05)}
#app .cv-eu .cv-av{width:36px;height:36px;border-radius:11px;position:relative;font-size:13px}
#app .cv-eu .cv-av .cv-pres{position:absolute;right:-3px;bottom:-3px;width:12px;height:12px;margin:0;border:2.5px solid var(--cv-lat)}
#app .cv-eu b{display:block;font-size:14px;font-weight:700;line-height:1.2}
#app .cv-eu small{display:block;font-size:12px;color:var(--cv-lat-mudo)}

/* avatares */
#app .cv-av{display:grid;place-items:center;flex:none;width:40px;height:40px;border-radius:12px;background:var(--c);color:#fff;font:700 14px/1 var(--cv-sans);letter-spacing:.01em;user-select:none}
#app .cv-av.m{width:26px;height:26px;border-radius:8px;font-size:10.5px}
#app .cv-av.g{width:34px;height:34px;border-radius:10px;font-size:12.5px}

/* canal */
#app .cv-canal,#app .cv-fio,#app .cv-busca{position:relative;flex-direction:column;min-width:0;min-height:0;background:var(--cv-papel)}
#app .cv-canal{display:flex}
#app .cv-cab{display:flex;align-items:center;gap:14px;height:64px;padding:0 20px 0 24px;border-bottom:1px solid var(--cv-fio);flex:none}
#app .cv-voltar{display:none;align-items:center;gap:4px;height:36px;margin-left:-10px;padding:0 8px 0 4px;border-radius:9px;color:var(--cv-menta-tx);font-weight:700}
#app .cv-cab-id{min-width:0;flex:1}
#app .cv-cab-id h2{display:flex;align-items:center;gap:6px;margin:0;font:750 17px/1.25 var(--cv-sans);letter-spacing:-.01em}
#app .cv-cab-id h2 .ic{width:17px;height:17px;color:var(--cv-leve)}
#app .cv-cab-id p{margin:1px 0 0;color:var(--cv-leve);font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#app .cv-estrela{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:8px;color:var(--cv-leve)}
#app .cv-estrela:hover{background:var(--cv-hover);color:var(--cv-tinta)}
#app .cv-estrela[aria-pressed=true]{color:var(--rc-estrela)}
#app .cv-estrela[aria-pressed=true] svg{fill:currentColor}
#app .cv-cab-acoes{display:flex;align-items:center;gap:6px}
#app .cv-membros{display:inline-flex;align-items:center;gap:10px;height:38px;padding:0 10px 0 6px;border-radius:11px;border:1px solid var(--cv-fio-forte);color:var(--cv-suave);font-weight:650}
#app .cv-membros:hover{background:var(--cv-hover);border-color:var(--cv-leve)}
#app .cv-pilha{display:flex}
#app .cv-pilha .cv-av{width:26px;height:26px;border-radius:9px;font-size:9px;letter-spacing:0;margin-right:-6px;border:2px solid var(--cv-papel)}
#app .cv-pilha{margin-right:6px}
#app .cv-icone{display:inline-grid;place-items:center;width:38px;height:38px;border-radius:11px;color:var(--cv-suave)}
#app .cv-icone:hover{background:var(--cv-hover);color:var(--cv-tinta)}
#app .cv-msgs{flex:1;min-height:0;overflow:auto;padding:8px 0 14px;scrollbar-width:thin;scrollbar-color:var(--cv-fio-forte) transparent}
#app .cv-dia{display:flex;align-items:center;gap:14px;margin:18px 24px 8px;color:var(--cv-leve);font:700 12px/1 var(--cv-sans);letter-spacing:.01em}
#app .cv-dia::before,#app .cv-dia::after{content:"";flex:1;height:1px;background:var(--cv-fio)}
#app .cv-dia span{padding:7px 14px;border-radius:99px;border:1px solid var(--cv-fio-forte);background:var(--cv-papel)}
#app .cv-novas{display:flex;align-items:center;gap:12px;margin:10px 24px 4px;color:var(--cv-menta-tx);font:800 11px/1 var(--cv-sans);letter-spacing:.12em;text-transform:uppercase}
#app .cv-novas::before{content:"";flex:1;height:1px;background:var(--cv-menta-f);opacity:.7}
#app .cv-novas span{padding:5px 10px;border-radius:99px;background:var(--cv-menta-bg)}

/* mensagem */
#app .cv-msg{position:relative;display:grid;grid-template-columns:40px minmax(0,1fr);column-gap:12px;padding:7px 28px 7px 24px}
#app .cv-msg:hover,#app .cv-msg:focus-within{background:var(--cv-hover)}
#app .cv-msg.cont{padding-top:1px;padding-bottom:1px}
#app .cv-msg.cont>.cv-av,#app .cv-msg.cont .cv-m-corpo>.cv-m-cab{display:none}
#app .cv-msg.cont .cv-hora-c{display:block}
#app .cv-hora-c{display:none;align-self:start;padding-top:5px;text-align:right;font-size:11px;color:var(--cv-leve);opacity:0;font-variant-numeric:tabular-nums}
#app .cv-msg:hover .cv-hora-c{opacity:1}
#app .cv-msg.cont .cv-m-corpo{grid-column:2}
#app .cv-msg.cont .cv-texto{margin-top:0}
#app .cv-msg.mencao-eu{background:var(--cv-eu-bg);box-shadow:inset 3px 0 0 var(--cv-menta-f)}
#app .cv-msg.mencao-eu:hover{background:var(--cv-eu-bg)}
#app .cv-msg.foco{background:var(--cv-menta-bg);box-shadow:inset 3px 0 0 var(--cv-menta-f)}
#app .cv-msg.pisca{animation:cv-pisca 1.8s ease-out}
#app .cv-m-cab{display:flex;align-items:baseline;flex-wrap:wrap;gap:2px 8px;line-height:1.3}
#app .cv-autor{font-size:15px;font-weight:750;letter-spacing:-.005em}
#app .cv-papel-t{font-size:12px;color:var(--cv-leve)}
#app .cv-m-cab time{font-size:12px;color:var(--cv-leve);font-variant-numeric:tabular-nums}
#app .cv-texto{margin-top:2px;font-size:15px;line-height:1.55;color:var(--cv-tinta);overflow-wrap:anywhere}
#app .cv-texto code{font:.88em/1.4 var(--cv-mono);padding:.1em .38em;border-radius:5px;background:var(--cv-fundo);border:1px solid var(--cv-fio);color:var(--cv-tinta)}
#app .cv-texto strong{font-weight:750}
#app .cv-men{display:inline;padding:.08em .38em;border-radius:6px;background:var(--cv-mencao-bg);color:var(--cv-mencao-tx);font-weight:650;white-space:nowrap}
#app .cv-men.eu{background:rgba(47,202,160,.26);color:var(--cv-eu-tx)}
:root[data-tema=escuro] #app .cv-men.eu{background:rgba(94,230,189,.2)}
#app .cv-can{display:inline;padding:.08em .38em;border-radius:6px;background:var(--cv-fundo);color:var(--cv-menta-tx);font-weight:650;border:0;cursor:pointer}
#app .cv-can:hover{text-decoration:underline}
#app mark{background:rgba(255,200,64,.55);color:inherit;border-radius:4px;padding:0 2px;margin:0 -1px}
:root[data-tema=escuro] #app mark{background:rgba(255,200,64,.3)}
#app .cv-acoes{position:absolute;top:-16px;right:24px;display:none;align-items:center;gap:2px;padding:3px;border:1px solid var(--cv-fio-forte);border-radius:11px;background:var(--cv-papel);box-shadow:0 6px 18px -8px rgba(10,30,40,.35);z-index:2}
#app .cv-msg:hover .cv-acoes,#app .cv-msg:focus-within .cv-acoes{display:flex}
#app .cv-acoes button{display:grid;place-items:center;width:32px;height:30px;border-radius:8px;color:var(--cv-suave)}
#app .cv-acoes button:hover{background:var(--cv-fundo);color:var(--cv-tinta)}
#app .cv-acoes .ic{width:17px;height:17px}

/* reações */
#app .cv-reacoes{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
#app .cv-r{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 10px 0 8px;border-radius:99px;border:1px solid var(--cv-fio-forte);background:var(--cv-papel);color:var(--cv-suave);font-size:12.5px;font-weight:700;font-variant-numeric:tabular-nums}
#app .cv-r .ic{width:15px;height:15px;color:var(--rc);stroke-width:1.9}
#app .cv-r:hover{border-color:var(--cv-leve);background:var(--cv-fundo)}
#app .cv-r[aria-pressed=true]{background:var(--cv-menta-bg);border-color:var(--cv-menta-f);color:var(--cv-menta-tx)}
#app .cv-r.mais{padding:0 8px;color:var(--cv-leve);opacity:0}
#app .cv-msg:hover .cv-r.mais,#app .cv-r.mais:focus-visible{opacity:1}

/* anexos e fio */
#app .cv-anexo{display:flex;align-items:center;gap:14px;max-width:440px;margin-top:8px;padding:11px 12px 11px 12px;border:1px solid var(--cv-fio-forte);border-radius:14px;background:var(--cv-papel)}
#app .cv-anexo:hover{border-color:var(--cv-leve)}
#app .cv-arq{display:grid;place-items:center;flex:none;width:42px;height:50px;border-radius:9px;background:#fbe6e3;color:#b3261c;font:800 10.5px/1 var(--cv-sans);letter-spacing:.06em;position:relative}
#app .cv-arq::before{content:"";position:absolute;right:0;top:0;width:12px;height:12px;border-radius:0 9px 0 6px;background:rgba(179,38,28,.22)}
:root[data-tema=escuro] #app .cv-arq{background:rgba(255,125,110,.16);color:#ff9d92}
#app .cv-anexo b{display:block;font-size:14px;font-weight:700;line-height:1.3;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#app .cv-anexo small{display:block;font-size:12px;color:var(--cv-leve)}
#app .cv-anexo>div{min-width:0;flex:1}
#app .cv-anexo .cv-baixar{display:grid;place-items:center;width:34px;height:34px;border-radius:9px;color:var(--cv-suave)}
#app .cv-anexo .cv-baixar:hover{background:var(--cv-fundo);color:var(--cv-tinta)}
#app .cv-imagem{max-width:440px;margin-top:8px;border:1px solid var(--cv-fio-forte);border-radius:14px;overflow:hidden;background:var(--cv-papel)}
#app .cv-imagem svg{display:block;width:100%;height:auto}
#app .cv-imagem figcaption{display:flex;align-items:center;gap:10px;padding:9px 12px;border-top:1px solid var(--cv-fio);font-size:12.5px;color:var(--cv-leve)}
#app .cv-imagem figcaption b{color:var(--cv-tinta);font-weight:700}
#app .cv-fio-res{display:inline-flex;align-items:center;gap:10px;max-width:100%;margin-top:6px;padding:5px 12px 5px 6px;border-radius:10px;border:1px solid transparent;color:var(--cv-menta-tx);font-size:13px;font-weight:700}
#app .cv-fio-res:hover{background:var(--cv-papel);border-color:var(--cv-fio-forte);box-shadow:0 4px 12px -8px rgba(10,30,40,.4)}
#app .cv-fio-res .mini{display:flex;padding-right:6px}
#app .cv-fio-res .mini .cv-av{width:24px;height:24px;font-size:8.5px;letter-spacing:0;margin-right:-5px;border:2px solid var(--cv-papel)}
#app .cv-fio-res small{color:var(--cv-leve);font-weight:500;font-size:12.5px}
#app .cv-fio-res .ic{width:14px;height:14px;opacity:0;transition:opacity .15s ease}
#app .cv-fio-res:hover .ic{opacity:1}
#app .cv-resp-c{display:none}

/* digitando + compositor */
#app .cv-digita{display:flex;align-items:center;gap:8px;height:22px;margin:0 24px 4px;color:var(--cv-leve);font-size:12.5px;visibility:hidden}
#app .cv-digita[data-ativo=true]{visibility:visible}
#app .cv-pontos{display:inline-flex;gap:3px}
#app .cv-pontos i{width:5px;height:5px;border-radius:50%;background:var(--cv-leve)}
#app .cv-comp{margin:0 24px 8px;border:1px solid var(--cv-fio-forte);border-radius:16px;background:var(--cv-papel);transition:border-color .15s ease,box-shadow .15s ease}
#app .cv-comp:focus-within{border-color:var(--cv-menta-f);box-shadow:0 0 0 4px rgba(47,202,160,.18)}
#app .cv-comp-topo{display:flex;flex-wrap:wrap;gap:6px;padding:10px 12px 0}
#app .cv-comp-topo:empty{display:none}
#app .cv-chipa{display:inline-flex;align-items:center;gap:8px;height:30px;padding:0 6px 0 10px;border-radius:9px;background:var(--cv-fundo);border:1px solid var(--cv-fio-forte);font-size:12.5px;font-weight:650}
#app .cv-chipa .cv-arq{width:18px;height:22px;font-size:0;border-radius:4px}
#app .cv-chipa button{display:grid;place-items:center;width:20px;height:20px;border-radius:6px;color:var(--cv-leve)}
#app .cv-chipa button:hover{background:var(--cv-fio);color:var(--cv-tinta)}
#app .cv-chipa .ic{width:12px;height:12px}
#app .cv-comp textarea{display:block;width:100%;min-height:46px;max-height:168px;padding:13px 16px 4px;border:0;outline:0;resize:none;background:none;font-size:15px;line-height:1.5;overflow:auto}
#app .cv-comp textarea::placeholder{color:var(--cv-leve)}
#app .cv-comp-base{display:flex;align-items:center;gap:2px;padding:4px 8px 8px 8px}
#app .cv-comp-base .cv-ib{display:grid;place-items:center;width:34px;height:34px;border-radius:9px;color:var(--cv-suave)}
#app .cv-comp-base .cv-ib:hover{background:var(--cv-fundo);color:var(--cv-tinta)}
#app .cv-comp-base .cv-ib.fmt{font:800 14px/1 var(--cv-sans)}
#app .cv-comp-base .cv-sep{width:1px;height:20px;margin:0 6px;background:var(--cv-fio-forte)}
#app .cv-dica{margin-left:auto;margin-right:10px;color:var(--cv-leve);font-size:12px}
#app .cv-enviar{display:inline-flex;align-items:center;gap:8px;height:36px;padding:0 14px 0 16px;border-radius:10px;background:var(--cv-menta-f);color:var(--cv-sobre-menta);font-weight:800;letter-spacing:.005em;box-shadow:0 1px 0 rgba(255,255,255,.35) inset}
#app .cv-enviar:hover{background:var(--cv-menta)}
#app .cv-enviar:active{transform:translateY(1px)}
#app .cv-enviar[disabled]{background:var(--cv-fundo);color:var(--cv-leve);box-shadow:none;cursor:default;transform:none}
#app .cv-enviar .ic{width:16px;height:16px}
#app .cv-rodape-c{margin:0 24px 14px;color:var(--cv-leve);font-size:12px;display:flex;gap:6px;align-items:center}
#app .cv-sug{position:absolute;left:12px;bottom:calc(100% + 8px);z-index:20;width:min(330px,calc(100% - 24px));padding:6px;border:1px solid var(--cv-fio-forte);border-radius:14px;background:var(--cv-papel);box-shadow:var(--cv-sombra)}
#app .cv-sug h6{margin:6px 10px 6px;font:700 11px/1 var(--cv-sans);letter-spacing:.12em;text-transform:uppercase;color:var(--cv-leve)}
#app .cv-sug li{display:flex;align-items:center;gap:10px;padding:7px 10px;border-radius:9px;cursor:pointer}
#app .cv-sug li[aria-selected=true]{background:var(--cv-menta-bg)}
#app .cv-sug li b{font-weight:700}
#app .cv-sug li small{color:var(--cv-leve);margin-left:auto;font-size:12px}
#app .cv-comp{position:relative}

/* popover */
#app .cv-pop{position:absolute;z-index:70;padding:8px;border:1px solid var(--cv-fio-forte);border-radius:14px;background:var(--cv-papel);box-shadow:var(--cv-sombra)}
#app .cv-pop-r{display:flex;gap:2px}
#app .cv-pop-r button{display:grid;place-items:center;width:38px;height:38px;border-radius:10px;color:var(--rc)}
#app .cv-pop-r button:hover{background:var(--cv-fundo);transform:translateY(-2px)}
#app .cv-pop-r .ic{width:21px;height:21px;stroke-width:1.9}
#app .cv-pop h6{margin:2px 6px 8px;font:700 11px/1 var(--cv-sans);letter-spacing:.12em;text-transform:uppercase;color:var(--cv-leve)}
#app .cv-pop-m{width:280px;padding:10px}
#app .cv-pop-m li{display:flex;align-items:center;gap:10px;padding:6px;border-radius:9px}
#app .cv-pop-m li b{font-weight:700;display:block;line-height:1.2}
#app .cv-pop-m li small{color:var(--cv-leve);font-size:12px}
#app .cv-pop-m li>div{flex:1;min-width:0}

/* painel de fio */
#app .cv-fio{border-left:1px solid var(--cv-fio);background:var(--cv-papel)}
#app .cv-fio .cv-cab{height:64px}
#app .cv-fio .cv-cab-id h2{font-size:16px}
#app .cv-fio-corpo{flex:1;min-height:0;overflow:auto;padding:6px 0 10px;scrollbar-width:thin;scrollbar-color:var(--cv-fio-forte) transparent}
#app .cv-fio .cv-msg{padding-left:20px;padding-right:20px}
#app .cv-fio .cv-acoes{right:16px}
#app .cv-fio-sep{display:flex;align-items:center;gap:12px;margin:12px 20px 6px;color:var(--cv-leve);font:700 12px/1 var(--cv-sans)}
#app .cv-fio-sep::after{content:"";flex:1;height:1px;background:var(--cv-fio)}
#app .cv-fio-base{flex:none;padding-top:12px;border-top:1px solid var(--cv-fio);background:var(--cv-papel)}
#app .cv-fio .cv-comp{margin:0 20px 16px}
#app .cv-tambem{display:flex;align-items:center;gap:10px;margin:0 20px 10px;color:var(--cv-suave);font-size:13px;cursor:pointer;width:max-content;max-width:calc(100% - 40px)}
#app .cv-tambem input{appearance:none;-webkit-appearance:none;width:18px;height:18px;margin:0;border-radius:6px;border:1.5px solid var(--cv-leve);background:var(--cv-papel);display:grid;place-items:center;cursor:pointer;flex:none}
#app .cv-tambem input::after{content:"";width:9px;height:5px;margin-top:-2px;border-left:2.2px solid var(--cv-sobre-menta);border-bottom:2.2px solid var(--cv-sobre-menta);transform:rotate(-45deg) scale(0)}
#app .cv-tambem input:checked{background:var(--cv-menta-f);border-color:var(--cv-menta-f)}
#app .cv-tambem input:checked::after{transform:rotate(-45deg) scale(1)}
#app .cv-fio-vazio{display:grid;place-items:center;gap:6px;height:100%;padding:30px;text-align:center;color:var(--cv-suave)}
#app .cv-fio-vazio b{font-size:18px;color:var(--cv-tinta)}

/* busca */
#app .cv-busca{display:none}
#app .cv-b-topo{padding:18px 28px 14px;flex:none;border-bottom:1px solid var(--cv-fio)}
#app .cv-b-linha{display:flex;align-items:center;gap:14px;margin-bottom:14px}
#app .cv-b-linha .cv-voltar{margin-left:-8px}
#app .cv-b-campo{display:flex;align-items:center;gap:12px;flex:1;min-width:0;height:54px;padding:0 10px 0 18px;border:1.5px solid var(--cv-fio-forte);border-radius:16px;background:var(--cv-papel);color:var(--cv-leve)}
#app .cv-b-campo:focus-within{border-color:var(--cv-menta-f);box-shadow:0 0 0 4px rgba(47,202,160,.18)}
#app .cv-b-campo .ic{width:21px;height:21px;color:var(--cv-menta-tx)}
#app .cv-b-campo input{flex:1;min-width:0;height:100%;border:0;outline:0;background:none;color:var(--cv-tinta);font-size:18px;font-weight:550;letter-spacing:-.005em}
#app .cv-b-campo input::placeholder{color:var(--cv-leve);font-weight:450}
#app .cv-b-limpar{display:grid;place-items:center;width:30px;height:30px;border-radius:50%;background:var(--cv-fundo);color:var(--cv-suave)}
#app .cv-b-limpar .ic{width:14px;height:14px;color:inherit}
#app .cv-b-filtros{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
#app .cv-b-filtros>span{font:700 11px/1 var(--cv-sans);letter-spacing:.12em;text-transform:uppercase;color:var(--cv-leve);margin-right:2px}
#app .cv-select{position:relative;display:inline-flex;align-items:center;height:34px;border-radius:99px;border:1px solid var(--cv-fio-forte);background:var(--cv-papel);color:var(--cv-suave);font-weight:650}
#app .cv-select select{appearance:none;-webkit-appearance:none;height:100%;padding:0 30px 0 14px;border:0;border-radius:99px;background:none;outline:0;font-weight:650;font-size:13px;cursor:pointer;color:inherit}
#app .cv-select .ic{position:absolute;right:10px;width:13px;height:13px;pointer-events:none}
#app .cv-select:hover{border-color:var(--cv-leve)}
#app .cv-select:focus-within{outline:2px solid var(--cv-menta-f);outline-offset:2px}
#app .cv-select.ativo{background:var(--cv-menta-bg);border-color:var(--cv-menta-f);color:var(--cv-menta-tx)}
#app .cv-fchip{display:inline-flex;align-items:center;gap:7px;height:34px;padding:0 14px;border-radius:99px;border:1px solid var(--cv-fio-forte);background:var(--cv-papel);color:var(--cv-suave);font-weight:650;font-size:13px}
#app .cv-fchip:hover{border-color:var(--cv-leve)}
#app .cv-fchip[aria-pressed=true]{background:var(--cv-menta-bg);border-color:var(--cv-menta-f);color:var(--cv-menta-tx)}
#app .cv-fchip .ic{width:15px;height:15px}
#app .cv-b-limparf{margin-left:auto;height:34px;padding:0 10px;border-radius:9px;color:var(--cv-menta-tx);font-weight:700;font-size:13px}
#app .cv-b-limparf:hover{background:var(--cv-menta-bg)}
#app .cv-b-corpo{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 280px}
#app .cv-b-res{min-height:0;overflow:auto;padding:16px 28px 28px;scrollbar-width:thin;scrollbar-color:var(--cv-fio-forte) transparent}
#app .cv-b-sum{display:flex;align-items:center;gap:12px;margin-bottom:12px;font-size:14px;color:var(--cv-suave)}
#app .cv-b-sum b{color:var(--cv-tinta);font-weight:750}
#app .cv-b-sum .cv-seg{margin-left:auto;display:inline-flex;padding:3px;border-radius:10px;background:var(--cv-fundo)}
#app .cv-b-sum .cv-seg button{height:28px;padding:0 12px;border-radius:8px;color:var(--cv-suave);font-weight:700;font-size:12.5px}
#app .cv-b-sum .cv-seg button[aria-pressed=true]{background:var(--cv-papel);color:var(--cv-tinta);box-shadow:0 1px 2px rgba(10,30,40,.15),0 0 0 1px var(--cv-fio)}
#app .cv-hit{position:relative;display:grid;grid-template-columns:40px minmax(0,1fr) auto;gap:2px 14px;width:100%;padding:14px 16px;margin-bottom:8px;border:1px solid var(--cv-fio);border-radius:16px;background:var(--cv-papel);text-align:left}
#app .cv-hit:hover{border-color:var(--cv-fio-forte);box-shadow:0 10px 24px -16px rgba(10,30,40,.4);background:var(--cv-papel)}
#app .cv-hit .cv-av{grid-row:span 3}
#app .cv-hit-cab{display:flex;align-items:center;flex-wrap:wrap;gap:2px 8px;line-height:1.3}
#app .cv-hit-cab b{font-size:14.5px;font-weight:750}
#app .cv-hit-cab time{font-size:12px;color:var(--cv-leve);font-variant-numeric:tabular-nums}
#app .cv-hit-can{display:inline-flex;align-items:center;gap:3px;height:22px;padding:0 8px 0 6px;border-radius:99px;background:var(--cv-fundo);color:var(--cv-suave);font-size:12px;font-weight:700}
#app .cv-hit-can .ic{width:12px;height:12px}
#app .cv-hit-fio{height:22px;display:inline-flex;align-items:center;padding:0 8px;border-radius:99px;background:var(--cv-menta-bg);color:var(--cv-menta-tx);font-size:11.5px;font-weight:750}
#app .cv-hit-txt{grid-column:2;font-size:14.5px;line-height:1.55;color:var(--cv-tinta);overflow-wrap:anywhere}
#app .cv-hit-anexo{grid-column:2;display:inline-flex;align-items:center;gap:8px;width:max-content;max-width:100%;margin-top:6px;padding:5px 10px;border-radius:9px;border:1px solid var(--cv-fio-forte);color:var(--cv-suave);font-size:12.5px;font-weight:600}
#app .cv-hit-anexo .ic{width:14px;height:14px}
#app .cv-hit-ir{grid-column:3;grid-row:1;align-self:center;display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 10px 0 12px;border-radius:9px;color:var(--cv-menta-tx);font-size:12.5px;font-weight:750;opacity:0}
#app .cv-hit:hover .cv-hit-ir,#app .cv-hit:focus-visible .cv-hit-ir,#app .cv-hit:focus-within .cv-hit-ir{opacity:1}
#app .cv-hit-ir .ic{width:14px;height:14px}
#app .cv-b-vazio{display:grid;place-items:center;gap:8px;padding:56px 20px;text-align:center;color:var(--cv-suave)}
#app .cv-b-vazio svg{width:116px;height:auto;color:var(--cv-leve)}
#app .cv-b-vazio b{font-size:19px;color:var(--cv-tinta);letter-spacing:-.01em}
#app .cv-b-vazio button{margin-top:6px;height:36px;padding:0 16px;border-radius:10px;background:var(--cv-menta-f);color:var(--cv-sobre-menta);font-weight:800}
#app .cv-b-fac{min-height:0;overflow:auto;padding:16px 22px 28px 20px;border-left:1px solid var(--cv-fio);background:var(--cv-fundo);scrollbar-width:thin}
#app .cv-b-fac h4{margin:0 0 8px;font:700 11px/1 var(--cv-sans);letter-spacing:.13em;text-transform:uppercase;color:var(--cv-leve)}
#app .cv-b-fac section+section{margin-top:24px}
#app .cv-fac{display:flex;align-items:center;gap:10px;width:100%;height:36px;padding:0 10px 0 8px;border-radius:10px;color:var(--cv-suave);font-weight:600;font-size:13.5px}
#app .cv-fac:hover{background:var(--cv-papel);color:var(--cv-tinta)}
#app .cv-fac[aria-pressed=true]{background:var(--cv-papel);color:var(--cv-menta-tx);box-shadow:0 0 0 1.5px var(--cv-menta-f)}
#app .cv-fac .cv-nome{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#app .cv-fac .n{font-size:12px;color:var(--cv-leve);font-variant-numeric:tabular-nums;font-weight:700}
#app .cv-fac .ic{width:16px;height:16px;color:var(--cv-leve)}
#app .cv-fac.zero{opacity:.45}

/* aviso */
#app .cv-aviso{position:absolute;left:50%;bottom:28px;z-index:80;display:flex;align-items:center;gap:14px;max-width:calc(100% - 32px);padding:11px 14px 11px 18px;border-radius:14px;background:var(--cv-lat);color:#fff;font-weight:600;box-shadow:var(--cv-sombra);transform:translate(-50%,24px);opacity:0;pointer-events:none}
#app .cv-aviso[data-aberto=true]{transform:translate(-50%,0);opacity:1;pointer-events:auto}
:root[data-tema=escuro] #app .cv-aviso{background:#1d3b4c}
#app .cv-aviso button{height:28px;padding:0 10px;border-radius:8px;color:var(--cv-menta);font-weight:800}
#app .cv-aviso button:hover{background:rgba(255,255,255,.12)}

/* telas médias */
@container app (max-width: 1160px){
  #app .cv-quadro{grid-template-columns:236px minmax(0,1fr)}
  #app[data-estado="2"] .cv-quadro{grid-template-columns:236px minmax(0,1fr) 380px}
  #app .cv-b-corpo{grid-template-columns:minmax(0,1fr) 240px}
  #app .cv-dica{display:none}
}
@container app (max-width: 1060px){
  #app[data-estado="2"] .cv-quadro{grid-template-columns:minmax(0,1fr) 380px}
  #app[data-estado="2"] .cv-lat{display:none}
}
@container app (max-width: 940px){
  #app .cv-b-corpo{grid-template-columns:minmax(0,1fr)}
  #app .cv-b-fac{display:none}
}

/* telas estreitas: canais e conversa se alternam; fio e busca ocupam a tela */
@container app (max-width: 860px){
  #app .cv-quadro,#app[data-estado="2"] .cv-quadro{display:block}
  #app .cv-lat,#app .cv-canal,#app .cv-fio,#app .cv-busca{position:absolute;inset:0;width:100%;height:100%}
  #app[data-estado="2"] .cv-canal,#app[data-estado="2"] .cv-lat{display:none}
  #app[data-estado="1"][data-painel="conversa"] .cv-lat,#app[data-estado="1"][data-painel="canais"] .cv-canal{display:none}
  #app[data-estado="3"] .cv-lat{display:none}
  #app .cv-voltar{display:inline-flex}
  #app .cv-fechar-fio,#app .cv-fechar-b{display:none}
  #app .cv-cab{height:60px;padding:0 10px 0 16px;gap:8px}
  #app .cv-cab-id h2{font-size:16.5px}
  #app .cv-cab-id p{display:none}
  #app .cv-estrela{display:none}
  #app .cv-membros{padding:0 8px 0 4px;border:0;gap:6px}
  #app .cv-membros .cv-pilha .cv-av:nth-child(n+3){display:none}
  #app .cv-lat-nav{padding-bottom:18px}
  #app .cv-lat .cv-ws{height:60px}
  #app .cv-msg{padding:7px 14px 7px 14px;column-gap:10px;grid-template-columns:36px minmax(0,1fr)}
  #app .cv-av{width:36px;height:36px;border-radius:11px}
  #app .cv-av.m{width:24px;height:24px}
  #app .cv-dia,#app .cv-novas{margin-left:14px;margin-right:14px}
  #app .cv-acoes,#app .cv-m-cab .cv-papel-t{display:none!important}
  #app .cv-resp-c{position:absolute;top:3px;right:8px;display:grid;place-items:center;width:32px;height:30px;border-radius:9px;color:var(--cv-leve)}
  #app .cv-resp-c:active{background:var(--cv-fundo)}
  #app .cv-resp-c .ic{width:16px;height:16px}
  #app .cv-r.mais{opacity:1}
  #app .cv-digita{margin-left:14px}
  #app .cv-comp,#app .cv-fio .cv-comp{margin-left:12px;margin-right:12px}
  #app .cv-rodape-c{display:none}
  #app .cv-comp-base .cv-sep,#app .cv-comp-base .fmt{display:none}
  #app .cv-fio .cv-msg{padding-left:14px;padding-right:14px}
  #app .cv-fio-sep{margin-left:14px;margin-right:14px}
  #app .cv-tambem{margin-left:14px}
  #app .cv-b-topo{padding:12px 14px 12px}
  #app .cv-b-campo{height:48px}
  #app .cv-b-campo input{font-size:16px}
  #app .cv-b-filtros{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin:0 -14px;padding:0 14px}
  #app .cv-b-filtros::-webkit-scrollbar{display:none}
  #app .cv-b-filtros>span,#app .cv-b-limparf{display:none}
  #app .cv-b-filtros>*{flex:none}
  #app .cv-b-res{padding:12px 12px 24px}
  #app .cv-hit{grid-template-columns:36px minmax(0,1fr);padding:12px}
  #app .cv-hit-ir{display:none}
  #app .cv-b-sum{flex-wrap:wrap}
  #app .cv-pop-r button{width:42px;height:42px}
  #app .cv-aviso{bottom:92px}
  #app .cv-lat-sec{height:38px}
  #app .cv-lat-item{height:40px;font-size:15.5px}
}

@media (prefers-reduced-motion:no-preference){
  #app .cv-lat-item,#app .cv-icone,#app .cv-r,#app .cv-fio-res,#app .cv-hit,#app .cv-fac,#app .cv-fchip,#app .cv-select,#app .cv-acoes button{transition:background-color .15s ease,color .15s ease,border-color .15s ease,box-shadow .15s ease}
  #app .cv-aviso{transition:transform .26s cubic-bezier(.2,.9,.3,1.2),opacity .2s ease}
  #app .cv-pontos i{animation:cv-ponto 1.2s infinite ease-in-out}
  #app .cv-pontos i:nth-child(2){animation-delay:.15s}
  #app .cv-pontos i:nth-child(3){animation-delay:.3s}
  #app .cv-pop{animation:cv-pop .14s ease-out}
  #app .cv-msg.nova{animation:cv-entra .28s ease-out}
  #app[data-estado="2"] .cv-fio{animation:cv-fio-entra .26s cubic-bezier(.2,.8,.2,1)}
  #app[data-estado="3"] .cv-busca{animation:cv-busca-entra .22s ease-out}
  @keyframes cv-ponto{0%,60%,100%{transform:translateY(0);opacity:.5}30%{transform:translateY(-3px);opacity:1}}
  @keyframes cv-pop{from{opacity:0;transform:translateY(4px) scale(.98)}to{opacity:1;transform:none}}
  @keyframes cv-entra{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  @keyframes cv-fio-entra{from{opacity:.4;transform:translateX(18px)}to{opacity:1;transform:none}}
  @keyframes cv-busca-entra{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
}
@keyframes cv-pisca{0%{background:rgba(255,200,64,.45)}100%{background:transparent}}
</style>
</head>

        var s = el("span", null, cor.nome || ""); s.appendChild(document.createElement("br"));
        s.appendChild(el("code", null, cor.hex));
        box.append(i, s); p.appendChild(box);
      });
      c.appendChild(p);
    }
    if (ficha.tipografia) { secao(c, "Tipografia"); c.appendChild(el("p", null, ficha.tipografia)); }
    if (Array.isArray(ficha.componentes) && ficha.componentes.length) {
      secao(c, "Peças da tela");
      var k = el("div", "stand-chips");
      ficha.componentes.forEach(function (t) { k.appendChild(el("span", "stand-chip", t)); });
      c.appendChild(k);
    }
    if (Array.isArray(ficha.replicar) && ficha.replicar.length) {
      secao(c, "Para virar produto");
      var ol = el("ol", "stand-passos");
      ficha.replicar.forEach(function (t) { ol.appendChild(el("li", null, t)); });
      c.appendChild(ol);
    }
    if (comTelaCheia) {
      // para as sócias: o que o botão faz e como guardar o app no iPhone
      secao(c, "Em tela cheia");
      c.appendChild(el("p", null, "O botão Tela cheia abre o app sozinho numa aba nova, sem o stand, do jeito que ele rodaria num iPhone."));
      c.appendChild(el("p", "stand-nota", "No iPhone, toque em Compartilhar e depois em “Adicionar à Tela de Início”. O app ganha um ícone e abre como aplicativo."));
      var bTela = acao("Abrir em tela cheia", ICONE.expandir, telaCheia);
      bTela.classList.add("stand-primario");
      c.appendChild(bTela);
    }
    secao(c, "Atalhos");
    c.appendChild(el("p", "stand-nota", "Teclas 1, 2 e 3 trocam o estado. O botão Código entrega o app sem o stand: um arquivo HTML só, que abre sozinho no navegador."));
    g.d.showModal();
  }

  // o código limpo: o DOM capturado antes do app rodar, sem os blocos do stand, com o script do app de volta
  function fonte() {
    var bruto = window.__standFonte || "";
    var scriptApp = document.getElementById("app-script");
    // a captura acontece de dentro do próprio bloco "captura": o fim dele e tudo que vem depois ainda não existiam.
    // \x3c no lugar de "<": este script vive inline, e a abertura de comentário HTML ou a tag de script escritas
    // por extenso (mesmo num comentário JS) fariam o parser HTML fechar ou engolir o bloco.
    var LT = "\x3c";
    var s = bruto
      .replace(/\x3c!-- stand:captura:inicio -->[\s\S]*?(?=\x3c\/body>)/, "")
      .replace(/\x3c!-- stand:([a-z]+):inicio -->[\s\S]*?\x3c!-- stand:\1:fim -->/g, "")
      .replace(/\x3cscript type="application\/json" id="maquete-ficha">[\s\S]*?\x3c\/script>/, "")
      .replace(/\x3ctemplate id="maquete-miniatura">[\s\S]*?\x3c\/template>/, "")
      .replace(/\x3chtml([^>]*)>/, function (_, a) { return LT + "html" + a.replace(/\s+data-(tema|portal)(="[^"]*")?/g, "") + ' data-tema="claro">'; })
      .replace(/\x3c\/head>/, LT + "style>html,body{margin:0}" + LT + "/style>\n" + LT + "script>document.documentElement.dataset.tema = matchMedia(\"(prefers-color-scheme: dark)\").matches ? \"escuro\" : \"claro\";" + LT + "/script>\n" + LT + "/head>");
    if (scriptApp) s = s.replace(/\x3c\/body>/, function () { return LT + "script>" + scriptApp.textContent + LT + "/script>\n" + LT + "/body>"; });
    return s.replace(/[ \t]+\n/g, "\n").replace(/\n{3,}/g, "\n\n");
  }

  function abrirCodigo() {
    var g = gaveta("Código do app", "Sem o stand · HTML único");
    var c = g.corpo;
    var texto = fonte();
    var barraC = el("div", "stand-codigo-barra");
    var aviso = el("span", "stand-nota", Math.round(texto.length / 1024) + " KB · CSS e JS embutidos");
    var area = el("textarea", "stand-codigo");
    area.readOnly = true; area.spellcheck = false; area.value = texto;
    area.setAttribute("aria-label", "Código HTML do app");
    var copiar = acao("Copiar tudo", ICONE.copiar, function () {
      var feito = function (ok) { aviso.textContent = ok ? "Copiado." : "Selecionado: use ⌘C para copiar."; };
      area.focus(); area.select();
      // na moldura do portal a Clipboard API é barrada pela política de permissões: vai direto ao execCommand
      if (!noPortal && navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(texto).then(function () { feito(true); }, function () { var ok = false; try { ok = document.execCommand("copy"); } catch (e) {} feito(ok); });
      } else { var ok = false; try { ok = document.execCommand("copy"); } catch (e) {} feito(ok); }
    });
    copiar.classList.add("stand-primario");
    barraC.appendChild(copiar);
    if (!noPortal) {
      barraC.appendChild(acao("Baixar .html", ICONE.baixar, function () {
        var a = el("a");
        a.href = URL.createObjectURL(new Blob([texto], {type: "text/html"}));
        a.download = (ficha.id || "maquete") + ".html";
        document.body.appendChild(a); a.click();
        setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
      }));
    }
    barraC.appendChild(aviso);
    c.append(barraC, area);
    g.d.showModal();
    area.scrollTop = 0;
  }

  // para as ferramentas (fotografar.mjs) e para quem inspeciona no console
  window.Stand = {irPara: irPara, tela: tela, fonte: fonte, ficha: ficha};
})();
</script>
<!-- stand:roteiro:fim -->
