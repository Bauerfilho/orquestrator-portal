UVFAEvnTf32/wC+jR50399v++jUVFAEvnTf32/76NHnTf32/wC+jUVFAEvnTf32/wC+jR50399v++jUVFAEvnTf32/76NHnTf32/wC+jUVFAEvnTf32/wC+jR50399v++jUVFAEvnTf32/76NHnTf32/wC+jUVFAEvnTf32/wC+jR50399v++jUVFAEvnTf32/76NHnTf32/wC+jUVFAEvnTf32/wC+jR50399v++jUVFAEvnTf32/76NHnTf32/wC+jUVFAEvnTf32/wC+jR50399v++jUVFAEvnTf32/76NHnTf32/wC+jUVFAEvnTf32/wC+jR50399v++jUVFAEvnTf32/76NHnTf32/wC+jUVFAEvnTf32/wC+jR50399v++jUVFAEvnTf32/76NHnTf32/wC+jUVFAHnHxYmlPhTl2/4+oe596+afMk/vN+Zr6S+LH/Iqf9vUP9a+aq+44f8A91+bPn8z/jfIf5kn95vzNHmSf3m/M0yivcPPH+ZJ/eb8zR5kn95vzNMooAf5kn95vzNHmSf3m/M0yigB/mSf3m/M0eZJ/eb8zTKKAH+ZJ/eb8zR5kn95vzNMooAf5kn95vzNHmSf3m/M0yigC5ZyyfbIPmb/AFqdz/eFegebL/fb8zXnln/x9wf9dU/9CFd/WFXc1hsf/9k=\"};\n  var BASE = [{\"id\":1,\"origem_id\":1414,\"quando\":\"2026-10-10T08:11:54\",\"titulo\":\"me fale sobre descolamento prematuro de placenta\",\"tema\":\"obs4\",\"cartinha\":\"doenca\",\"tempo\":34.8,\"numeros_fora\":[],\"docs_fora\":[],\"pergunta\":\"me fale sobre descolamento prematuro de placenta\",\"texto\":\"# Fisiopatologia\\nO descolamento prematuro de placenta (DPP-NI) é uma das principais emergências obstétricas hemorrágicas, reconhecida mundialmente como uma situação ameaçadora à vida com capacidade de evolução rápida para near miss e óbitos materno e fetal. Ele é definido pelo descolamento parcial ou completo da placenta, normalmente inserida de forma inopinada, intempestiva e prematura no corpo do útero, após a 20ª semana de gestação, podendo complicar até 1% das gestações. Sua etiologia ainda resta pouco esclarecida, sendo sua ocorrência praticamente restrita à segunda metade da gravidez. É frequente a associação de fatores como idade materna avançada, multiparidade, distúrbios hipertensivos, rotura prematura das membranas, hábito de fumar, presença de trombofilias, usuários de cocaína e DPP prévio. Dentro da fisiopatologia do DPP descrevemos as alterações locais (uterinas) e as gerais (alterações de coagulação, renais e hipofisárias). As alterações uterinas caracterizam-se pela hipertonia uterina e apoplexia uteroplacentária; as alterações renais por necrose tubular aguda e necrose cortical aguda, as hipofisárias pela síndrome de Sheehan e as alterações da coagulação por coagulopatia de consumo e processo de fibrinólise.\\n\\n# Sintomas\\nOs sinais e sintomas mais comumente relacionados ao DPP-NI incluem dor abdominal de início súbito, sangramento vaginal caracteristicamente escurecido, hipersensibilidade à palpação uterina, hipertonia uterina e alterações na vitalidade fetal. Importante salientar que não há correlação entre o volume de sangue externado e o acometimento fetal, uma vez que um em cada cinco casos pode simplesmente não manifestar sangramento vaginal.\\n\\n# Diagnóstico\\nA abordagem inicial deve ser fundamentalmente clínica, embora achados de exames complementares possam ser utilizados como apoio em casos selecionados cujas manifestações clínicas não se façam presentes. Na presença de achados clínicos compatíveis, sua solicitação não deve retardar a abordagem terapêutica. Os principais diagnósticos diferenciais a serem traçados nos sangramentos de segunda metade da gravidez incluem o trabalho de parto, a ruptura uterina e a placenta prévia. Em relação à ultrassonografia, quando presente a imagem de hematoma retroplacentário, o valor preditivo positivo supera 80%, porém sua não visualização não o descarta. A sensibilidade geral do método oscila entre 25% a 60%.\\n\\n**Passo a passo do diagnóstico:**\\n1. Avaliar manifestações clínicas (dor abdominal súbita, sangramento escurecido, hipertonia uterina, alterações na vitalidade fetal).\\n2. Se houver hematoma retroplacentário visível na ultrassonografia, considerar valor preditivo positivo >80%.\\n3. Se a imagem não for visualizada, não descartar o diagnóstico.\\n4. Considerar trabalho de parto, ruptura uterina e placenta prévia como diagnósticos diferenciais.\\n\\n# Tratamento\\n1. Orientações gerais: Garantir dois acessos venosos periféricos calibrosos e solicitar exames laboratoriais para avaliação de função hepática, função renal, eletrólitos, hemograma completo, provas de coagulação e tipagem sanguínea. Caso não haja disponibilidade imediata de provas de coagulação mais elaboradas, colher uma amostra de sangue periférico materno e mantê-lo em tubo de ensaio seco; considera-se coagulopatia instalada se após sete minutos não houver formação de coágulo firme. Quadros clinicamente mais exuberantes demandam pronta reserva de quatro unidades de hemoconcentrados.\\n2. Clínico: A qualquer sinal de instabilidade hemodinâmica, infundir 1.000 mL de solução cristaloide com os primeiros 500 mL realizados em dez minutos, e o restante ao longo de duas horas. Manter a paciente sondada e seu débito urinário observado e mantido acima de 30 mL/hora.\\n3. Cirúrgico ou definitivo: A amniotomia é mandatória para minimizar riscos, uma vez que se relaciona com redução da hemorragia materna e do risco de coagulação intravascular disseminada e embolia amniótica. Uma vez estabelecido o diagnóstico ou a forte suspeita de DPP-NI, duas questões devem balizar a tomada de decisão pelo médico-assistente: a estabilidade hemodinâmica materna e a presença de feto vivo. Gestantes com IG maior ou igual a 24/26 semanas e evidências de sofrimento fetal demandam abordagem de parto imediata, caso as condições locais permitam suporte perinatal ou transferência para serviço de maior complexidade. Nesses casos, se a expectativa de tempo para parto superar 20 minutos, o parto cesáreo deve ser preferido. Nos casos de óbito fetal ou feto de viabilidade incerta (IG \x3c24 semanas) com estabilidade clínico-laboratorial materna, a via de parto vaginal é preferível, contanto que esta não ponha em risco o bem-estar materno e tenha previsão de nascimento entre quatro a seis horas.\\n\\n# Acompanhamento\\nConsultas: O quadro materno deve ser reavaliado a cada hora por meio de pressão arterial, pulso, diurese, hemograma e coagulograma. Havendo alterações, o fluxograma deve ser reavaliado.\\nO que medir: Pressão arterial, pulso, diurese, hemograma e coagulograma.\\nExames e quando: Hemograma completo, provas de coagulação e tipagem sanguínea (solicitados na abordagem inicial).\\nVitalidade: Alterações na vitalidade fetal são um sinal chave.\\nParto: A amniotomia é mandatória para minimizar riscos.\\nDepois: O fluxograma resume a abordagem recomendada.\\n\\n# Controle\\nA fonte não traz.\\n\\n# Complicações\\nA fonte não traz.\",\"cola\":{\"doenca\":\"Descolamento prematuro de placenta\",\"fonte\":\"MS-GAR-2022\",\"capitulo\":\"5 Síndromes hemorrágicas da segunda metade da gestação\",\"como\":\"nome\",\"topicos\":[\"conceito\",\"fisiopatologia\",\"quadro_clinico\",\"diagnostico\",\"tratamento\",\"acompanhamento\",\"complicacoes\",\"prevencao\",\"outros\"],\"tokens\":1287,\"tokens_modelo\":1287,\"cortada\":false,\"fontes\":[\"MS-GAR-2022\"],\"leitora\":\"Professora 2B (treinada)\",\"secoes\":[{\"titulo\":\"Introdução\",\"paginas\":[89,89]},{\"titulo\":\"Diagnóstico\",\"paginas\":[90,90]},{\"titulo\":\"Conduta\",\"paginas\":[90,91]}],\"figuras\":[{\"tipo\":\"Quadro\",\"numero\":\"2\",\"legenda\":\"Fatores de risco associados ao DPP-NI\",\"pagina\":89,\"caminho\":\"quadro-2-p89.jpg\"},{\"tipo\":\"Fluxograma\",\"numero\":\"1\",\"legenda\":\"Conduta no DPP\",\"pagina\":91,\"caminho\":\"fluxograma-1-p91.jpg\"}],\"buscas\":[],\"auditoria\":{\"itens\":[\"«Perguntas numeradas e níveis controlada / parcial / não controlada com conduta:» → removida (a conferente 2B: a fonte não sustenta)\"],\"revisada\":true,\"modo\":\"2b\"},\"fichamento\":{\"validos\":30,\"descartados\":0},\"texto\":\"[Manual de Gestação de Alto Risco (MS 2022) · 5 Síndromes hemorrágicas da segunda metade da gestação · conceito · p. 89–89]\\n#### 5.2.1 Introdução\\n\\nO descolamento prematuro de placenta normalmente inserida (DPP-NI) representa uma das principais emergências obstétricas hemorrágicas, sendo mundialmente reconhecida como uma situação ameaçadora à vida e com capacidade de evolução rápida para situações de near miss , assim como para óbitos materno e fetal. É definido pelo descolamento parcial ou completo da placenta, normalmente inserida de forma inopinada, intempestiva e prematura no corpo do útero, após a 20ª semana de gestação, e pode complicar até 1% das gestações. Sua etiologia ainda resta pouco esclarecida, e sua ocorrência é praticamente restrita à segunda metade da gravidez. É frequente a associação de fatores como idade materna avançada, multiparidade, distúrbios hipertensivos, rotura prematura das membranas, hábito de fumar, presença de trombofilias, usuários de cocaína e DPP prévio. O Quadro 2 exibe os fatores de risco envolvidos na sua gênese.\\n\\n**Quadro 2 – Fatores de risco associados ao DPP-NI** | | Idade materna ≥35 anos e \x3c20 anos | |---|---| | Fatores de risco sociodemográficos | Paridade ≥3 | | | Etnia negra | | | Síndromes hipertensivas | | Fatores de risco na gestação atual | Trauma Distúrbios no líquido amniótico | | | Placenta prévia | | Fatores de risco em gestação pregressa | Cesárea anterior Pré-eclâmpsia Descolamento prematuro de placenta | _Fonte: traduzido e adaptado de TIKKANEN, 2011._\\n\\nDentro da fisiopatologia do DPP descrevemos as alterações locais (uterinas) e as gerais (alterações de coagulação, renais e hipofisárias). As alterações uterinas caracterizam-se pela hipertonia uterina e apoplexia uteroplacentária; as alterações renais por necrose tubular aguda e necrose cortical aguda, as hipofisárias pela síndrome de Sheehan e as alterações da coagulação por coagulopatia de consumo e processo de fibrinólise.\\n\\n[Manual de Gestação de Alto Risco (MS 2022) · 5 Síndromes hemorrágicas da segunda metade da gestação · diagnóstico · p. 90–90]\\n#### 5.2.2 Diagnóstico\\n\\nSegue sendo fundamentalmente clínico, embora achados de exames complementares possam ser utilizados como apoio em casos selecionados cujas manifestações clínicas não se façam presentes. Na presença de achados clínicos compatíveis, sua solicitação não deve retardar a abordagem terapêutica. Os sinais e sintomas mais comumente relacionados ao DPP-NI incluem dor abdominal de início súbito, sangramento vaginal caracteristicamente escurecido, hipersensibilidade à palpação uterina, hipertonia uterina e alterações na vitalidade fetal. Importante salientar que não há correlação entre o volume de sangue externado e o acometimento fetal, uma vez que um em cada cinco casos pode simplesmente não manifestar sangramento vaginal. Os principais diagnósticos diferenciais a serem traçados nos sangramentos de segunda metade da gravidez incluem o trabalho de parto, a ruptura uterina e a placenta prévia. Em relação à ultrassonografia, quando presente a imagem de hematoma retroplacentário, o valor preditivo positivo supera 80%, porém sua não visualização não o descarta. A sensibilidade geral do método oscila entre 25% a 60%.\\n\\n[Manual de Gestação de Alto Risco (MS 2022) · 5 Síndromes hemorrágicas da segunda metade da gestação · tratamento · p. 90–91]\\n#### 5.2.3 Conduta\\n\\nA abordagem inicial deve incluir a garantia de dois acessos venosos periféricos calibrosos e a solicitação de exames laboratoriais para avaliação de função hepática, função renal, eletrólitos, hemograma completo, provas de coagulação e tipagem sanguínea. Caso não haja disponibilidade imediata de provas de coagulação mais elaboradas, uma técnica útil é colher uma amostra de sangue periférico materno e mantê-lo em tubo de ensaio seco. Se após sete minutos não houver formação de coágulo firme, considera-se coagulopatia instalada. Quadros clinicamente mais exuberantes demandam pronta reserva de quatro unidades de hemoconcentrados. A qualquer sinal de instabilidade hemodinâmica, 1.000 mL de solução cristaloide devem ser infundidos com os primeiros 500 mL realizados em dez minutos, e o restante ao longo de duas horas. A paciente deve ser sondada e seu débito urinário observado e mantido acima de 30 mL/hora. A amniotomia é mandatória para minimizar riscos, uma vez que se relaciona com redução da hemorragia materna e do risco de coagulação intravascular disseminada e embolia amniótica. Uma vez estabelecido o diagnóstico ou a forte suspeita de DPP-NI, duas questões devem balizar a tomada de decisão pelo médico-assistente: a estabilidade hemodinâmica materna e a presença de feto vivo. Gestantes com IG maior ou igual a 24/26 semanas e evidências de sofrimento fetal demandam abordagem de parto imediata, caso as condições locais permitam suporte perinatal ou transferência para serviço de maior complexidade. Nesses casos, se a expectativa de tempo para parto superar 20 minutos, o parto cesáreo deve ser preferido. Nos casos de óbito fetal ou feto de viabilidade incerta (IG \x3c24 semanas) com estabilidade clínico-laboratorial materna, a via de parto vaginal é preferível, contanto que esta não ponha em risco o bem-estar materno e tenha previsão de nascimento entre quatro a seis horas. O Fluxograma 1 resume a abordagem recomendada. Fluxograma 1 – Conduta no DPP Fonte: adaptado de FEITOSA et al ., 2018. *O quadro materno deve ser reavaliado a cada hora por meio de pressão arterial, pulso, diurese, hemograma e coagulograma. Havendo alterações, o fluxograma deve ser reavaliado. **Considerar abreviar expulsivo por meio de parto instrumentalizado.\",\"resumo\":\"Descolamento prematuro de placenta — MS-GAR-2022 · 5 Síndromes hemorrágicas da segunda metade da gestação\"}},{\"id\":2,\"origem_id\":1332,\"titulo\":\"placenta prévia: diagnóstico e conduta\",\"tema\":\"obs4\",\"cartinha\":\"bloco\",\"tempo\":35.2,\"numeros_fora\":[],\"docs_fora\":[],\"pergunta\":\"placenta prévia: diagnóstico e conduta\",\"texto\":\"# Diagnóstico e Tratamento da Placenta Prévia\\n\\n## Diagnóstico\\n\\nA ultrassonografia transvaginal é considerada o padrão-ouro para confirmação diagnóstica. Ela permite verificar melhor a localização placentária e sua relação com o orifício interno do colo uterino.\\n\\n**Passo a passo:**\\n1. Realizar ultrassonografia transvaginal.\\n2. Avaliar a inserção placentária e sua proximidade com o colo uterino.\\n3. Considerar a idade gestacional para determinar se o diagnóstico está estabelecido (ver abaixo).\\n\\n*Fluxograma de decisão:*\\n- Se a placenta estiver segmentada antes da 20ª semana: pode ocorrer até 25% das gestantes normais, mas boa parte dessas placentas \\\"migrará\\\" e se posicionará longe do colo no termo. Mesmo após a 22ª semana, é possível haver \\\"migração placentária\\\". Portanto, o diagnóstico ultrassonográfico de placenta prévia somente se estabelece após a **26ª semana** de gestação.\\n- Se houver achado isolado de inserção placentária segmentar antes da 20ª semana, não basta considerar placenta prévia imediatamente, pois há risco de migração futura.\\n\\nA avaliação clínica associada à avaliação ultrassonográfica permite classificar a placenta prévia em quatro tipos, segundo sua relação com o colo uterino (Quadro 1).\\n\\n**Diagnósticos diferenciais:**\\n- Descolamento prematuro da placenta normalmente inserida.\\n- Vasa previa.\\n- Ruptura do seio marginal.\\n- Patologias cervicais, como pólipos, ectrópios sangrantes e tumores.\\n\\n**Limitações técnicas:**\\n- Pela via transabdominal, é necessária a repleção vesical parcial para uma boa avaliação do segmento inferior.\\n- A placenta prévia de inserção posterior no útero pode ser de difícil visualização, mesmo na ultrassonografia transvaginal.\\n- A formação de hematoma pode dificultar a identificação da relação entre a borda da placenta e o orifício cervical, prejudicando o diagnóstico.\\n- A ressonância magnética pode ser indicada para avaliar as relações entre a placenta e o colo, devido às diferentes características dos dois tecidos, e também é útil nos casos de acretismo. No entanto, não é utilizada para o diagnóstico de placenta prévia devido a seu alto custo, disponibilidade limitada e também pela segurança e precisão bem estabelecidas da ultrassonografia transvaginal.\\n\\n## Tratamento\\n\\n### 1. Orientações gerais\\n- Todas as pacientes com sangramento da segunda metade da gravidez têm indicação de internação para avaliação materna e fetal.\\n- Recomenda-se manter repouso no leito até que a hemorragia seja estabilizada, com cessação do sangramento por seis horas.\\n- A avaliação do bem-estar fetal é obrigatória, pois a anemia materna pode promover a hipóxia fetal.\\n- Para as gestantes com tipagem Rh negativo, deve ser realizada a profilaxia com imunoglobulina anti-D nas situações em que estiver indicada.\\n- A internação hospitalar prolongada oferece à paciente a garantia do repouso, a avaliação contínua da saúde materno-fetal e o atendimento imediato em caso de nova hemorragia. (Nota: tem custos financeiro e emocional elevados).\\n- Excepcionalmente, para algumas poucas pacientes selecionadas, após estabilização do quadro, avaliação individual e do suporte familiar, pode ser ponderado o benefício do repouso domiciliar e do acompanhamento estrito, caso seja necessário reduzir a angústia emocional da gestante com a hospitalização por período prolongado.\\n- Para os casos em que é adotada a conduta expectante, recomenda-se avaliação quinzenal do crescimento fetal e da localização placentária, para programação do parto.\\n- A resolução da gestação deve ser individualizada, ponderando os riscos da hemorragia materna e do parto.\\n\\n### 2. Tratamento clínico\\n- Na vigência de sangramento ativo, recomenda-se obter dois acessos venosos calibrosos que permitam a reposição de volume para manter a estabilidade hemodinâmica e débito urinário acima de 30 mL/h; a vigilância dos sinais vitais a cada hora, ou a intervalos menores, a depender da intensidade do sangramento; e providenciar a reserva de sangue para reposição, se necessário.\\n- Exames laboratoriais complementares incluem: tipagem sanguínea, hemograma completo, avaliação de função renal pela ureia e creatinina, e coagulograma.\\n- A conduta obstétrica no manejo da gestante com placenta prévia depende dos elementos de conduta: gravidade da hemorragia, estimativa da maturidade fetal, condição fetal e presença ou não de trabalho de parto (Figura 1).\\n- Nas gestações abaixo de 34 semanas, a corticoterapia para acelerar a maturidade pulmonar fetal é indicada.\\n- Não há evidência que justifique o uso da tocólise em casos de placenta prévia.\\n- O uso de misoprostol é contraindicado.\\n- O risco de hemorragia pós-parto também aumenta, pelas alterações de contratilidade do segmento inferior do útero.\\n- O prognóstico materno é favorável, e a morbidade materna está relacionada principalmente à hemorragia pré-parto e/ou pós-parto.\\n- Há maior propensão a transfusões de sangue, histerectomia pós-parto, ligaduras arteriais ou embolização dos vasos pélvicos, particularmente se houver o acretismo.\\n\\n### 3. Tratamento cirúrgico ou definitivo\\n- A cesariana é o parto preferencial.\\n- Alguns advogam a incisão longitudinal no útero, quando o segmento inferior não comportar a histerotomia transversa ou apresentar vascularização intensa, sugerindo áreas de invasão e acretismo. (A decisão pelo tipo de incisão uterina deve ser tomada com a cavidade abdominal aberta, inspecionando-se diretamente o segmento inferior).\\n- No acretismo parcial ou total, a histerectomia é a terapêutica mais indicada.\",\"cola\":{\"doenca\":\"Placenta prévia\",\"fonte\":\"MS-GAR-2022\",\"capitulo\":\"5 Síndromes hemorrágicas da segunda metade da gestação\",\"como\":\"nome\",\"topicos\":[\"diagnostico\",\"tratamento\"],\"tokens\":1665,\"tokens_modelo\":1665,\"cortada\":false,\"fontes\":[\"MS-GAR-2022\"],\"leitora\":\"Professora 2B (treinada)\",\"secoes\":[{\"titulo\":\"Ultrassonografia\",\"paginas\":[85,86]},{\"titulo\":\"Conduta\",\"paginas\":[86,88]}],\"figuras\":[{\"tipo\":\"Quadro\",\"numero\":\"1\",\"legenda\":\"Classificação do tipo de placenta prévia ao exame ultrassonográfico, considerando sua relação com o orifício interno do colo\",\"pagina\":85,\"caminho\":\"quadro-1-p85.jpg\"},{\"tipo\":\"Figura\",\"numero\":\"1\",\"legenda\":\"Elementos de conduta obstétrica em casos de placenta prévia\",\"pagina\":87,\"caminho\":\"figura-1-p87.jpg\"}],\"buscas\":[],\"auditoria\":{\"itens\":[],\"revisada\":false,\"modo\":\"2b\"},\"fichamento\":{\"validos\":47,\"descartados\":0},\"texto\":\"[Manual de Gestação de Alto Risco (MS 2022) · 5 Síndromes hemorrágicas da segunda metade da gestação · diagnóstico · p. 85–86]\\n#### 5.1.3 Ultrassonografia\\n\\nA ultrassonografia transvaginal é considerada o padrão-ouro para confirmação diagnóstica. O diagnóstico diferencial principal é com o descolamento prematuro da placenta normalmente inserida. A ultrassonografia transvaginal permite verificar melhor a localização placentária e sua relação com o orifício interno do colo uterino. Pela via transabdominal, é necessária a repleção vesical parcial para uma boa avaliação do segmento inferior. Outros diagnósticos diferenciais incluem vasa previa, ruptura do seio marginal e patologias cervicais, como pólipos, ectrópios sangrantes e tumores. A avaliação clínica associada à avaliação ultrassonográfica permite classificar a placenta prévia em quatro tipos, segundo sua relação com o colo uterino (Quadro 1). A classificação é dinâmica, pois poderá variar com o avanço da idade gestacional e também se o colo apresentar algum grau de dilatação.\\n\\n**Quadro 1 – Classificação do tipo de placenta prévia ao exame ultrassonográfico, considerando sua relação com o orifício interno do colo** | Classificação | Descrição da placenta | |---|---| | Centro-total ou completa | Recobre totalmente o orifício interno | | | Recobre parcialmente o orifício | | Centro-parcial ou parcial | | | | interno | | | A borda placentária atinge a borda do | | Marginal | | | | orifício interno | | | Implantação no segmento inferior, | | Lateral ou baixa | | | | sem atingir o orifício interno | _Fonte: NOMURA, 2021._\\n\\nO achado ultrassonográfico isolado de inserção placentária segmentar, antes da 20a semana, pode ocorrer em até 25% das gestantes normais. Entretanto, boa parte dessas placentas “migrará” e se posicionará longe do colo no termo. Mesmo após a 22a semana, é possível haver “migração placentária”. Portanto, o diagnóstico ultrassonográfico de placenta prévia somente se estabelece após a 26ª semana de gestação. A placenta prévia de inserção posterior no útero pode ser de difícil visualização, mesmo na ultrassonografia transvaginal. Além disso, a formação de hematoma pode dificultar a identificação da relação entre a borda da placenta e o orifício cervical, prejudicando o diagnóstico. A ressonância magnética pode ser indicada para avaliar as relações entre a placenta e o colo, devido às diferentes características dos dois tecidos, e também é útil nos casos de acretismo. No entanto, não é utilizada para o diagnóstico de placenta prévia devido a seu alto custo, disponibilidade limitada e também pela segurança e precisão bem estabelecidas da ultrassonografia transvaginal.\\n\\n[Manual de Gestação de Alto Risco (MS 2022) · 5 Síndromes hemorrágicas da segunda metade da gestação · tratamento · p. 86–88]\\n#### 5.1.4 Conduta\\n\\nA conduta clínica no manejo da paciente com placenta prévia depende da intensidade do sangramento. Na vigência de sangramento ativo, recomenda-se obter dois acessos venosos calibrosos que permitam a reposição de volume para manter a estabilidade hemodinâmica e débito urinário acima de 30 mL/h; a vigilância dos sinais vitais a cada hora, ou a intervalos menores, a depender da intensidade do sangramento; e providenciar a reserva de sangue para reposição, se necessário. Exames laboratoriais complementares incluem: tipagem sanguínea, hemograma completo, avaliação de função renal pela ureia e creatinina, e coagulograma. A conduta obstétrica no manejo da gestante com placenta prévia depende dos elementos de conduta: gravidade da hemorragia, estimativa da maturidade fetal, condição fetal e presença ou não de trabalho de parto (Figura 1). Figura 1 – Elementos de conduta obstétrica em casos de placenta prévia Fonte: NOMURA, 2021. Todas as pacientes com sangramento da segunda metade da gravidez têm indicação de internação para avaliação materna e fetal. Em gestações longe do termo, em que não se espera maturidade fetal, é indicada a conduta expectante, afastados os demais elementos que indicam a resolução imediata. Recomenda-se manter repouso no leito até que a hemorragia seja estabilizada, com cessação do sangramento por seis horas. A avaliação do bem-estar fetal é obrigatória, pois a anemia materna pode promover a hipóxia fetal. A avaliação laboratorial inclui tipagem sanguínea, hemograma completo e coagulograma. Pode haver a necessidade de transfusão sanguínea, principalmente quando a hemoglobina materna for inferior a 8,0 g/dL. A ultrassonografia confirma o diagnóstico, avalia a idade gestacional e possibilita a estimativa do peso fetal. Nas gestações abaixo de 34 semanas, a corticoterapia para acelerar a maturidade pulmonar fetal é indicada. Não há evidência que justifique o uso da tocólise em casos de placenta prévia. É importante alertar que, para as gestantes com tipagem Rh negativo, deve ser realizada a profilaxia com imunoglobulina anti-D nas situações em que estiver indicada. A internação hospitalar prolongada oferece à paciente a garantia do repouso, a avaliação contínua da saúde materno-fetal e o atendimento imediato em caso de nova hemorragia. Entretanto, tem custos financeiro e emocional elevados. Excepcionalmente, para algumas poucas pacientes selecionadas, após estabilização do quadro, avaliação individual e do suporte familiar, pode ser ponderado o benefício do repouso domiciliar e do acompanhamento estrito, caso seja necessário reduzir a angústia emocional da gestante com a hospitalização por período prolongado. Para os casos em que é adotada a conduta expectante, recomenda-se avaliação quinzenal do crescimento fetal e da localização placentária, para programação do parto. Alcançada a maturidade fetal, com 36 semanas, é indicada a resolução da gestação. Nos casos de hemorragia grave, a interrupção imediata da gestação é obrigatória, independentemente da idade gestacional, pelo elevado risco materno e fetal. A cesariana é o parto preferencial. Alguns advogam a incisão longitudinal no útero, quando o segmento inferior não comportar a histerotomia transversa ou apresentar vascularização intensa, sugerindo áreas de invasão e acretismo. A decisão pelo tipo de incisão uterina deve ser tomada com a cavidade abdominal aberta, inspecionando-se diretamente o segmento inferior. No acretismo parcial ou total, a histerectomia é a terapêutica mais indicada. O parto vaginal poderá ser escolhido nas placentações laterais e/ ou marginais. Se for optado pela via vaginal, as membranas deverão ser rompidas precocemente, pois o tamponamento do bordo placentário pela apresentação reduz o sangramento. A monitorização fetal no intraparto deve ser contínua e a ocitocina deve ser utilizada de forma segura. O uso de misoprostol é contraindicado. O risco de hemorragia pós-parto também aumenta, pelas alterações de contratilidade do segmento inferior do útero. O prognóstico materno é favorável, e a morbidade materna está relacionada principalmente à hemorragia pré-parto e/ou pós-parto. Há maior propensão a transfusões de sangue, histerectomia pós-parto, ligaduras arteriais ou embolização dos vasos pélvicos, particularmente se houver o acretismo. O diagnóstico precoce da placenta prévia permite o adequado planejamento no cuidado materno e fetal. O momento da resolução da gestação deve ser individualizado, ponderando os riscos da hemorragia materna e do parto prematuro, ressaltando-se o uso da corticoterapia antenatal quando necessário.\",\"resumo\":\"Placenta prévia — MS-GAR-2022 · 5 Síndromes hemorrágicas da segunda metade da gestação\"}},{\"id\":3,\"origem_id\":1336,\"titulo\":\"tratamento da gravidez ectópica com metotrexato\",\"tema\":\"obs4\",\"cartinha\":\"bloco\",\"tempo\":33.3,\"numeros_fora\":[],\"docs_fora\":[],\"pergunta\":\"tratamento da gravidez ectópica com metotrexato\",\"texto\":\"# Tratamento da Gravidez Ectópica com Metotrexato\\n\\n### 1. Orientações gerais\\nO diagnóstico da gravidez ectópica pode ser realizado de forma mais precoce utilizando métodos não invasivos e possui múltiplas opções terapêuticas. Entre essas, destacam-se a cirurgia e o tratamento clínico. A cirurgia é considerada a conduta-padrão no tratamento da gravidez ectópica. A laparotomia deve ser realizada nos casos de ruptura tubária com instabilidade hemodinâmica; nas demais situações, a via preferencial é a laparoscópica. A salpingectomia está indicada para as pacientes com prole constituída, nos casos de lesão tubária irreparável, nas tentativas de salpingostomia com sangramento persistente, quando ocorre recidiva de gravidez ectópica na mesma tuba e quando os títulos do beta-hCG são elevados. A indicação da cirurgia conservadora, salpingostomia, é para as pacientes com desejo de preservar a fertilidade. Um dos riscos da cirurgia conservadora é a persistência de tecido trofoblástico (3% a 20%), portanto é importante, no pós-operatório, acompanhar a evolução dos títulos do beta-hCG.\\n\\n### 2. Tratamento clínico\\n As contraindicações incluem: gravidez intrauterina; imunodeficiência; anemia, leucopenia (leucócitos \x3c2.000 cél./ mm3) ou trombocitopenia (plaquetas \x3c100.000); sensibilidade prévia ao MTX, na vigência de doença pulmonar; disfunção importante hepática e renal; amamentação; imagem de gravidez ectópica com embrião vivo; declínio dos títulos da beta-hCG no intervalo de 24/48 horas antes do tratamento; recusa em receber transfusão sanguínea; e impossibilidade de dar continuidade ao acompanhamento. Antes de iniciar o tratamento, devem ser realizados os seguintes exames de rotina: hemograma, enzimas hepáticas (TGO e TGP), creatinina e tipagem sanguínea ABO-Rh.\\n\\nO parâmetro mais importante para o tratamento medicamentoso com MTX na gravidez ectópica é o beta-hCG. Os preditores de insucesso da terapia medicamentosa são: atividade cardíaca embrionária, massa maior que 4 cm, concentração inicial de beta-hCG maior que 5.000 mUI/mL, presença de sangue na cavidade peritoneal, aumento do beta-hCG acima de 50% nas 48 horas que antecedem o uso do MTX, aumento rápido e contínuo do beta-hCG durante o uso do MTX. O protocolo de dose única é ministrar o MTX na dose de 50 mg/m² por via intramuscular. O acompanhamento faz-se por dosagens da beta-hCG, realizadas no quarto e no sétimo dia após o emprego dessa droga. As pacientes com redução dos títulos de beta-hCG acima de 15%, apurada entre o quarto e o sétimo dia, apresentam bom prognóstico, devendo ser acompanhadas com dosagens semanais da beta-hCG até atingirem os níveis pré-gravídicos. Quando a redução for menor que 15%, no sétimo dia após o emprego do MTX, é ministrada nova dose de MTX, seguindo a mesma sistematização predita. Caso não ocorra queda dos títulos, deve ser indicada a cirurgia. O protocolo de múltiplas doses consiste na aplicação intramuscular de MTX na dose de 1 mg/kg (nos dias 1, 3, 5 e 7), alternando com leucovorin (ácido folínico) na dose de 0,1 mg/ kg ou comprimido de ácido folínico na dose de 15 mg (nos dias 2, 4, 6 e 8). O acompanhamento é feito com dosagem de beta-hCG no dia da aplicação inicial do MTX e sempre dosado antes de aplicar uma futura dose de MTX. Caso os títulos caiam mais que 15% nesse intervalo, não é necessária uma nova dose de MTX e, nesse protocolo, não se deve dar mais que quatro doses de MTX. Caso os títulos da beta-hCG não apresentem declínio após quatro doses do MTX, deve ser indicada a cirurgia. O acompanhamento nos dois protocolos (dose única e de múltiplas doses), quando os títulos estão em declínio, é feito com a dosagem semanal da beta-hCG até os títulos ficarem negativos. O protocolo com duas doses consiste na aplicação do MTX no dia 1 e 4. Esse protocolo tem eficácia e segurança semelhante ao tratamento com dose única, no entanto apresenta melhores resultados com títulos do beta-hCG mais elevados na faixa entre 3.600 mUI/mL e 5.000 mUI/mL. Recomenda-se evitar, durante o tratamento: relações sexuais até os títulos do beta-hCG ficarem negativos; exposição solar para diminuir o risco de dermatites pelo MTX; bebidas alcoólicas; aspirina; comidas e vitaminas que contenham ácido fólico. Deve-se também evitar nova concepção até o desaparecimento da gravidez ectópica na USTV e por período de três meses após a utilização do MTX. A USTV seriada após o tratamento com MTX é desnecessária, exceto quando existe suspeita de ruptura tubária.\\n\\n**Fonte:** Manual de Gestação de Alto Risco (MS 2022), p. 66–69\",\"cola\":{\"doenca\":\"Gravidez ectópica\",\"fonte\":\"MS-GAR-2022\",\"capitulo\":\"4 Síndromes hemorrágicas da primeira metade da gestação\",\"como\":\"nome\",\"topicos\":[\"tratamento\"],\"tokens\":2064,\"tokens_modelo\":2064,\"cortada\":false,\"fontes\":[\"MS-GAR-2022\"],\"leitora\":\"Professora 2B (treinada)\",\"secoes\":[{\"titulo\":\"Tratamento\",\"paginas\":[66,66]},{\"titulo\":\"Tratamento cirúrgico\",\"paginas\":[66,66]},{\"titulo\":\"Tratamento clínico (conduta expectante)\",\"paginas\":[66,66]},{\"titulo\":\"Tratamento medicamentoso\",\"paginas\":[67,69]},{\"titulo\":\"Tratamento local com MTX\",\"paginas\":[69,69]},{\"titulo\":\"Conduta nas gestações de localização atípica (não tubária)\",\"paginas\":[69,70]}],\"figuras\":[{\"tipo\":\"Figura\",\"numero\":\"4\",\"legenda\":\"Associação entre Beta-hCG e ultrassonografia\",\"pagina\":70,\"caminho\":\"figura-4-p70.jpg\"},{\"tipo\":\"Figura\",\"numero\":\"5\",\"legenda\":\"Fluxograma para o tratamento da gravidez ectópica\",\"pagina\":70,\"caminho\":\"figura-5-p70.jpg\"}],\"buscas\":[],\"auditoria\":{\"itens\":[\"«Os principais critérios para indicação do metotrexato (MTX) são: estabilidade hemodinâmica, diâmetro da massa anexial ≤3,5 cm, beta-hCG inicial ≤5.000 mUI/mL, a» → removida (a conferente 2B: a fonte não sustenta)\"],\"revisada\":true,\"modo\":\"2b\"},\"fichamento\":{\"validos\":38,\"descartados\":0},\"texto\":\"[Manual de Gestação de Alto Risco (MS 2022) · 4 Síndromes hemorrágicas da primeira metade da gestação · tratamento · p. 66–66]\\n#### 4.4.3 Tratamento\\n\\nO diagnóstico da gravidez ectópica tem sido realizado de forma mais precoce com métodos não invasivos e com mais opções terapêuticas. Entre elas, destacam-se a cirurgia, que pode ser a salpingectomia ou a salpingostomia por via laparotômica ou laparoscópica, e o tratamento clínico, que pode ser feito pela conduta expectante ou pelo tratamento medicamentoso com metotrexato.\\n\\n[Manual de Gestação de Alto Risco (MS 2022) · 4 Síndromes hemorrágicas da primeira metade da gestação · tratamento · p. 66–66]\\n#### 4.4.3.1 Tratamento cirúrgico\\n\\nA cirurgia é a conduta-padrão no tratamento da gravidez ectópica. A operação clássica é a salpingectomia. A laparotomia deve ser realizada nos casos de ruptura tubária com instabilidade hemodinâmica; nas demais situações, a via preferencial é a laparoscópica. A salpingectomia está indicada para as pacientes com prole constituída, nos casos de lesão tubária irreparável, nas tentativas de salpingostomia com sangramento persistente, quando ocorre recidiva de gravidez ectópica na mesma tuba e quando os títulos do beta-hCG são elevados. A indicação da cirurgia conservadora, salpingostomia, é para as pacientes com desejo de preservar a fertilidade. Um dos riscos da cirurgia conservadora é a persistência de tecido trofoblástico (3% a 20%), portanto é importante, no pós-operatório, acompanhar a evolução dos títulos do beta-hCG. Títulos em declínio requerem apenas acompanhamento, mas, quando em ascensão, está indicado tratamento com dose única de metotrexato (50 mg/m2 por via intramuscular).\\n\\n[Manual de Gestação de Alto Risco (MS 2022) · 4 Síndromes hemorrágicas da primeira metade da gestação · tratamento · p. 66–66]\\n#### 4.4.3.2 Tratamento clínico (conduta expectante)\\n\\nEm linhas gerais, recomenda-se a conduta expectante nas seguintes circunstâncias:\\n\\n– Com estabilidade hemodinâmica.\\n\\n– Declínio dos títulos de beta-hCG no intervalo de 24 a 48 horas.\\n\\n– Beta-hCG ≤2.000 mUI/mL.\\n\\n– Ultrassonografia transvaginal com ausência de embrião vivo, massa tubária inferior a 5 cm e desejo de gravidez futura.\\n\\n[Manual de Gestação de Alto Risco (MS 2022) · 4 Síndromes hemorrágicas da primeira metade da gestação · tratamento · p. 67–69]\\n#### 4.4.3.3 Tratamento medicamentoso\\n\\nOs principais critérios para indicação do metotrexato (MTX) são:\\n\\n– Estabilidade hemodinâmica.\\n\\n– Diâmetro da massa anexial ≤3,5 cm.\\n\\n– Beta-hCG inicial ≤5.000 mUI/mL.\\n\\n– Ausência de dor abdominal.\\n\\n– Desejo de gravidez futura.\\n\\n– Termo de consentimento assinado.\\n\\nAs contraindicações são: gravidez intrauterina;\\n\\nimunodeficiência; anemia, leucopenia (leucócitos \x3c2.000 cél./ mm3) ou trombocitopenia (plaquetas \x3c100.000); sensibilidade prévia ao MTX, na vigência de doença pulmonar; disfunção importante hepática e renal; amamentação; imagem de gravidez ectópica com embrião vivo; declínio dos títulos da beta-hCG no intervalo de 24/48 horas antes do tratamento; recusa em receber transfusão sanguínea; e impossibilidade de dar continuidade ao acompanhamento. Antes de iniciar o tratamento, devem ser realizados os seguintes exames de rotina: hemograma, enzimas hepáticas (TGO e TGP), creatinina e tipagem sanguínea ABO-Rh. O parâmetro mais importante para o tratamento medicamentoso com MTX na gravidez ectópica é o beta-hCG. Os preditores de insucesso da terapia medicamentosa são: atividade cardíaca embrionária, massa maior que 4 cm, concentração inicial de beta-hCG maior que 5.000 mUI/mL, presença de sangue na cavidade peritoneal, aumento do beta-hCG acima de 50% nas 48 horas que antecedem o uso do MTX, aumento rápido e contínuo do beta-hCG durante o uso do MTX. O protocolo de dose única é ministrar o MTX na dose de 50 mg/m2 por via intramuscular. O acompanhamento faz-se por dosagens da beta-hCG, realizadas no quarto e no sétimo dia após o emprego dessa droga. As pacientes com redução dos títulos de beta-hCG acima de 15%, apurada entre o quarto e o sétimo dia, apresentam bom prognóstico, devendo ser acompanhadas com dosagens semanais da beta-hCG até atingirem os níveis pré-gravídicos. Quando a redução for menor que 15%, no sétimo dia após o emprego do MTX, é ministrada nova dose de MTX, seguindo a mesma sistematização predita. Caso não ocorra queda dos títulos, deve ser indicada a cirurgia. O protocolo de múltiplas doses consiste na aplicação intramuscular de MTX na dose de 1 mg/kg (nos dias 1, 3, 5 e 7), alternando com leucovorin (ácido folínico) na dose de 0,1 mg/ kg ou comprimido de ácido folínico na dose de 15 mg (nos dias 2, 4, 6 e 8). O acompanhamento é feito com dosagem de beta-hCG no dia da aplicação inicial do MTX e sempre dosado antes de aplicar uma futura dose de MTX. Caso os títulos caiam mais que 15% nesse intervalo, não é necessária uma nova dose de MTX e, nesse protocolo, não se deve dar mais que quatro doses de MTX. Caso os títulos da beta-hCG não apresentem declínio após quatro doses do MTX, deve ser indicada a cirurgia. O acompanhamento nos dois protocolos (dose única e de múltiplas doses), quando os títulos estão em declínio, é feito com a dosagem semanal da beta-hCG até os títulos ficarem negativos. O protocolo com duas doses consiste na aplicação do MTX no dia 1 e 4. Esse protocolo tem eficácia e segurança semelhante ao tratamento com dose única, no entanto apresenta melhores resultados com títulos do beta-hCG mais elevados na faixa entre 3.600 mUI/mL e 5.000 mUI/mL. Recomenda-se evitar, durante o tratamento: relações sexuais até os títulos do beta-hCG ficarem negativos; exposição solar para diminuir o risco de dermatites pelo MTX; bebidas alcoólicas; aspirina; comidas e vitaminas que contenham ácido fólico. Deve-se também evitar nova concepção até o desaparecimento da gravidez ectópica na USTV e por período de três meses após a utilização do MTX. Recomenda-se evitar, durante o tratamento: relações sexuais até os títulos do beta-hCG ficarem negativos; exposição solar para diminuir o risco de dermatites pelo MTX; bebidas alcoólicas; aspirina; comidas e vitaminas que contenham ácido fólico. Deve-se também evitar nova concepção até o desaparecimento da gravidez ectópica na USTV e por período de três meses após a utilização do MTX. A USTV seriada após o tratamento com MTX é desnecessária, exceto quando existe suspeita de ruptura tubária. Os efeitos adversos mais observados do tratamento com MTX são: distensão abdominal, aumento do beta-hCG entre o primeiro e o quarto dias após o MTX, sangramento genital e dor abdominal. Os efeitos colaterais mais relatados são: mucosites, irritação gástrica, náusea, vômitos, tontura, neutropenia, alopecia reversível e pneumonite. O emprego da imunoglobulina anti-D em pacientes Rh negativo, independentemente do tipo de tratamento utilizado na gravidez ectópica, é a regra adotada por diversos guidelines .\\n\\n[Manual de Gestação de Alto Risco (MS 2022) · 4 Síndromes hemorrágicas da primeira metade da gestação · tratamento · p. 69–69]\\n#### 4.4.3.4 Tratamento local com MTX\\n\\nO MTX pode ser ministrado localmente na gravidez ectópica, em geral guiado por USTV. Para realizar esse procedimento, é necessário sedar a paciente e fazer a injeção com agulha calibre 20 ou 22 acoplada à sonda vaginal. A dose do MTX é de 1 mg/kg. Essa técnica, comparada com o tratamento sistêmico, apresenta desvantagens, pois o tratamento sistêmico é mais prático, fácil de ministrar, menos dependente das habilidades do especialista e é totalmente não invasivo. A principal indicação para o tratamento local é a presença de embrião vivo e nos casos de localização atípica da gravidez ectópica.\\n\\n[Manual de Gestação de Alto Risco (MS 2022) · 4 Síndromes hemorrágicas da primeira metade da gestação · tratamento · p. 69–70]\\n#### 4.4.4 Conduta nas gestações de localização atípica (não tubária)\\n\\nA conduta nos casos de gravidez intersticial, cervical e de cicatriz de cesárea deve ser sempre individualizada. O tratamento sistêmico com MTX é realizado nos casos em que o embrião não apresenta batimentos cardíacos. O esquema do tratamento dependerá do título inicial da beta-hCG. Em caso com títulos inferiores a 5.000 mUI/mL, emprega-se a dose única do MTX 50 mg/ m2 IM. Por outro lado, se os títulos da beta-hCG forem superiores a 5.000 mUI/mL, utiliza-se o protocolo com múltiplas doses de MTX. Quando o embrião está vivo, é realizado o tratamento local guiado por USTV com injeção de MTX no interior do saco gestacional na dose de 1 mg/kg. Quando os títulos da beta-hCG forem maiores de 5.000 mUI/mL, complementa-se o tratamento com o protocolo de múltiplas doses via sistêmica, iniciando no dia seguinte ao da punção. Na gravidez ovariana e abdominal, o tratamento, na maioria das vezes, é cirúrgico. Figura 4 – Associação entre Beta-hCG e ultrassonografia Fonte: adaptado de ELITO JUNIOR et al. , 2008. Figura 5 – Fluxograma para o tratamento da gravidez ectópica Fonte: ELITO JUNIOR et al. , 2008.\",\"resumo\":\"Gravidez ectópica — MS-GAR-2022 · 4 Síndromes hemorrágicas da primeira metade da gestação\"}}];\n  window.__MAQ_FIG = function(c){ return FIG[c] || FIG[String(c).split('/').pop()] || ''; };\n  function p(n){ return String(n).padStart(2, '0'); }\n  function agoraMenos(min){ var d = new Date(Date.now() - min * 60000); d.setSeconds(0, 0); return d.toISOString(); }\n  function semAcento(s){ return String(s || '').toLowerCase().normalize('NFD').replace(/[\\u0300-\\u036f]/g, ''); }\n  // o histórico da maquete: as 3 conversas reais, com hora de hoje (como o app mostra \"Hoje\")\n  var seqMsg = 100, seqConv = 10;\n  var conversas = BASE.map(function(v, i){\n    var quando = agoraMenos([3, 9, 16][i] || 20 + i);\n    return {id: v.id, criada: quando, atualizada: quando, titulo: v.titulo, estado: {}, mensagens: [\n      {id: ++seqM totrex|\\bmtx\\b/.test(t)) return BASE[2]; return null; }\n  var AVISO = 'Nesta maquete, só três perguntas têm resposta preparada — e são respostas reais do app, gravadas em 9 e 10 de outubro de 2026:\\n\\n'\n    + '1. me fale sobre descolamento prematuro de placenta\\n2. placenta prévia: diagnóstico e conduta\\n3. tratamento da gravidez ectópica com metotrexato\\n\\n'\n    + 'Escreva uma delas (ou toque numa conversa ao lado) para ver a resposta chegar com as figuras da fonte. No app de verdade, qualquer pergunta vai para a especialista certa — são 19 — e a resposta sai da biblioteca, com a fonte e a página.';\n  // o streaming como o app faz: eventos \"data: {...}\" com pausas (a resposta real levou o tempo que o rodapé mostra)\n  function perguntar(corpo){\n    var pedido = JSON.parse(corpo || '{}'), texto = String(pedido.texto || ''), cid = pedido.conversa;\n    var v = cid ? conversas.filter(function(x){ return x.id === cid; })[0] : null;\n    if (!v){ var q = agoraMenos(0); v = {id: ++seqConv, criada: q, atualizada: q, titulo: texto.slice(0, 80), estado: {}, mensagens: []}; conversas.push(v); }\n    v.mensagens.push({id: ++seqMsg, quando: new Date().toISOString(), papel: 'voce', texto: texto, tema: null, cartinha: null, numeros_fora: [], docs_fora: [], tempo: null, cola: null});\n    var R = escolhe(texto), enc = new TextEncoder(), fila = [], fechado = false;\n    function ev(obj, atraso){ fila.push([obj, atraso || 0]); }\n    if (R){\n      var T = D.temas[R.tema] || {titulo: 'Especialista', escopo: ''};\n      ev({tipo: 'inicio', conversa: v.id}, 50);\n      ev({tipo: 'roteador', quem: R.cola.leitora, tema: R.tema, titulo: T.titulo, escopo: T.escopo, confianca: 0.93, segundo: null}, 450);\n      ev({tipo: 'cola', resumo: R.cola.resumo, tem_texto: true, doenca: R.cola.doenca, fonte: R.cola.fonte, capitulo: R.cola.capitulo, como: R.cola.como, topicos: R.cola.topicos, tokens: R.cola.tokens, fontes: R.cola.fontes, secoes: R.cola.secoes, cortada: false}, 700);\n  {} };\nconst T = new URLSearchParams(location.search).get('t'); const api = p => p + (T ? (p.includes('?') ? '&' : '?') + 't=' + encodeURIComponent(T) : '');\n\n// ---------------------------------------------------------------- desenho da resposta (markdown dos pequenos → HTML)\nconst esc = s => s.replace(/&/g, '&amp;').replace(/\x3c/g, '&lt;').replace(/>/g, '&gt;');\nconst SEP = /^\\s*:?-{2,}:?(\\s*\\|\\s*:?-{2,}:?)*\\s*$/;\nfunction inline(s) {\n  s = esc(s);\n  s = s.replace(/\\*\\*(.+?)\\*\\*/g, '\x3cb>$1\x3c/b>').replace(/(^|\\s)\\*(?!\\s)(.+?)\\*(?=\\s|$|[.,;:])/g, '$1\x3ci>$2\x3c/i>').replace(/`([^`]+)`/g, '\x3ccode>$1\x3c/code>');\n  s = s.replace(/(^|\\s)(·\\s*)?(\\*\\*)?(alarme|sinal de alarme|alerta)(\\*\\*)?\\s*:/gi, '$1\x3cspan class=\"alarme\">$4:\x3c/span>');\n  return s;\n}\nfunction celulas(l) { return l.trim().replace(/^\\|/, '').replace(/\\|$/, '').split('|').map(c => c.trim()); }\nfunction desenhar(texto) {\n  const L = texto.replace(/\\r/g, '').split('\\n'); const out = []; let i = 0; let lista = null;\n  const fechaLista = () => { if (lista) { out.push(`\x3c/${lista}>`); lista = null; } };\n  while (i \x3c L.length) {\n    const l = L[i]; const t = l.trim();\n    if (!t) { fechaLista(); i++; continue; }\n    // tabela: linhas com | (com ou sem barra no começo) e, de preferência, uma linha ---|---\n    if (t.includes('|') || SEP.test(t)) {\n      let j = i; const bloco = [];\n      while (j \x3c L.length && L[j].trim() && (L[j].includes('|') || SEP.test(L[j]))) { bloco.push(L[j]); j++; }\n      const corpo = bloco.filter(b => !SEP.test(b)); const temSep = bloco.some(b => SEP.test(b));\n      if (corpo.length >= 2 && (temSep || corpo.length >= 3)) {\n        fechaLista(); let cab = celulas(corpo[0]); let titulo = '';\n        const m = corpo[0].match(/^\\s*\\|?\\s*((?:tabela|quadro)\\s*\\d*\\s*[–—-]\\s*[^|]+?)\\s*\\|/i);\n        if (m) { titulo = m[1].trim(); cab[0] = titulo.split(/[–—-]\\s*/).slice(1).join('– ').trim() || cab[0]; }\n        if (titulo) out.push(`\x3cdiv class=\"tabela-nome\">${inline(titulo)}\x3c/div>`);\n        const n = Math.max(...corpo.map(c => celulas(c).length));\n        out.push('\x3ctable>\x3cthead>\x3ctr>' + cab.concat(Array(Math.max(0, n - cab.length)).fill('')).map(c => `\x3cth>${inline(c)}\x3c/th>`).join('') + '\x3c/tr>\x3c/thead>\x3ctbody>');\n        for (const r of corpo.slice(1)) { const cs = celulas(r); out.push('\x3ctr>' + cs.concat(Array(Math.max(0, n - cs.length)).fill('')).map(c => `\x3ctd>${inline(c)}\x3c/td>`).join('') + '\x3c/tr>'); }\n        out.push('\x3c/tbody>\x3c/table>'); i = j; continue;\n      }\n      if (temSep && corpo.length === 1) { fechaLista(); out.push(`\x3cdiv class=\"tabela-nome\">${inline(celulas(corpo[0]).join(' · '))}\x3c/div>`); i = j; continue; }\n    }\n    // \"1. … · 2. … · 3. …\" numa linha só → fluxograma em passos\n    if (/(^|\\s)1\\.\\s.+\\s·\\s*2\\.\\s/.test(t)) { fechaLista(); out.push('\x3cdiv class=\"fluxo\">' + t.split(/\\s·\\s*(?=\\d{1,2}\\.\\s)/).map(x => `\x3cdiv>${inline(x.trim())}\x3c/div>`).join('') + '\x3c/div>'); i++; continue; }\n    let m;\n    if ((m = t.match(/^#{1,2}\\s+(.+)$/))) { fechaLista(); out.push(`\x3ch2>${inline(m[1])}\x3c/h2>`); i++; continue; }\n    if ((m = t.match(/^#{3,6}\\s+(.+)$/))) { fechaLista(); out.push(`\x3ch3>${inline(m[1])}\x3c/h3>`); i++; continue; }\n    if ((m = t.match(/^\\*\\*([^*]{2,60})\\*\\*\\s*:?\\s*$/))) { fechaLista(); out.push(`\x3ch3>${inline(m[1])}\x3c/h3>`); i++; continue; }   // **Sintomas:** sozinho na linha\n    if ((m = t.match(/^(?:\\*\\*)?([A-ZÀ-Úa-zà-ú][^:*]{1,40}):(?:\\*\\*)?\\s+(.+)$/)) && /^(fisiopatologia|sintomas|diagn[oó]stico|tratamento|acompanhamento|controle|complica[cç][oõ]es|conduta|preven[cç][aã]o|para levar|por isso|o que me preocupa primeiro|hip[oó]teses|o que fazer agora|o que n[aã]o fazer|o que orientar|quando (encaminhar|internar)|como seguir)/i.test(m[1])) {\n      fechaLista(); out.push(`\x3ch3>${inline(m[1])}\x3c/h3>\x3cp>${inline(m[2])}\x3c/p>`); \n}\n\n// ---------------------------------------------------------------- conversa\nfunction chips(msg) {\n  const box = el('div', 'chips');\n  if (msg.tema && estado.temas[msg.tema]) box.appendChild(el('span', 'chip', estado.temas[msg.tema].titulo + ' · ' + estado.temas[msg.tema].escopo.split(':')[0].split(',')[0]));\n  const cola = msg.cola;\n  if (cola && cola.secoes && cola.secoes.length) {\n    const c = el('span', 'chip fonte'); const p = el('span', 'ponto' + ((msg.numeros_fora || []).length || (msg.docs_fora || []).length ? ' ambar' : '')); c.appendChild(p);\n    const s0 = cola.secoes[0]; const fonte = (cola.fonte || '').replace(/^(MS|FEBRASGO|INCA|OPAS)-/, '$1 ').replace(/-/g, ' ');\n    c.appendChild(document.createTextNode('📚 ' + fonte + ' · ' + (cola.capitulo || '').slice(0, 40) + (s0 && s0.paginas ? ' · p. ' + s0.paginas[0] + (s0.paginas[1] !== s0.paginas[0] ? '–' + s0.paginas[1] : '') : '')));\n    if (cola.secoes.length > 1) c.appendChild(el('span', 'mais', ' +' + (cola.secoes.length - 1)));\n    if (cola.fontes && cola.fontes.length > 1) c.appendChild(el('span', 'mais', ' + ' + cola.fontes.slice(1).map(f => f.replace(/^(MS|FEBRASGO|INCA|OPAS|OMS|RS)-/, '$1 ').replace(/-/g, ' ')).join(' + ')));   // 08/10: fontes da mesma doença juntas\n    if (cola.cortada) c.appendChild(el('span', 'mais', ' · ela leu ' + Math.round((cola.tokens_modelo || 0) / 100) / 10 + 'k de ' + Math.round((cola.tokens || 0) / 100) / 10 + 'k'));\n    c.title = (msg.numeros_fora || []).length ? 'Números fora da cola: ' + msg.numeros_fora.join(', ') : 'Tudo o que ela leu antes de responder';\n    c.onclick = () => verCola(msg.id, cola); box.appendChild(c);\n  } else if (msg.cola === null && msg.papel === 'ultra') box.appendChild(el('span', 'chip', 'sem cola'));\n  return box;\n}\nfunction figuras(cola) {   // as imagens da fonte aberta (figura, quadro, fluxograma), anexadas à resposta\n  const box = el('div', 'figuras'); if (!cola || !cola.figuras || !cola.figuras.length) return bo  r.json();\n  $('#mensagens').innerHTML = ''; $('#boas-vindas').classList.add('oculto'); $('#titulo-conversa').textContent = v.titulo || 'Conversa nova';\n  for (const m of v.mensagens) mostrarMensagem(m);\n  document.querySelectorAll('.cartao').forEach(c => c.classList.toggle('ativo', +c.dataset.id === id));\n  if (window.innerWidth \x3c= 820) $('#app').classList.add('sem-lateral');\n  rolar();\n}\nfunction nova() { estado.conversa = null; $('#mensagens').innerHTML = ''; $('#boas-vindas').classList.remove('oculto'); $('#titulo-conversa').textContent = 'Specialist Ai'; document.querySelectorAll('.cartao').forEach(c => c.classList.remove('ativo')); if (window.innerWidth \x3c= 820) $('#app').classList.add('sem-lateral'); $('#entrada').focus(); }\nfunction rolar() { const c = $('#conversa'); c.scrollTop = c.scrollHeight; }\n\nasync function enviar() {\n  const texto = $('#entrada').value.trim(); if (!texto || estado.gerando) return;\n  estado.gerando = true; $('#btn-enviar').disabled = true; $('#entrada').value = ''; ajustar();\n  $('#boas-vindas').classList.add('oculto'); mostrarMensagem({ papel: 'voce', texto });\n  const d = el('div', 'msg ultra'); const quem = el('div', 'quem', 'roteando…'); const pens = el('div', 'pensando'); const corpo = el('div', 'corpo'); d.append(quem, pens, corpo); $('#mensagens').appendChild(d); rolar();\n  const buscasBox = el('div', 'chips buscas'); d.insertBefore(buscasBox, corpo);\n  let resposta = ''; let cola = null; let tema = null; let ultimo = 0;\n  try {\n    const r = await fetch(api('/api/perguntar'), { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ conversa: estado.conversa, texto }) });\n    const leitor = r.body.getReader(); const dec = new TextDecoder(); let buf = '';\n    while (true) {\n      const { value, done } = await leitor.read(); if (done) break; buf += dec.decode(value, { stream: true });\n      let k; while ((k = buf.indexOf('\\n\\n')) >= 0) {\n        const linha = buf.sli
