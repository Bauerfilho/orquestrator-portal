<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Calculadora RCOG · TEV · maquete</title>
<style>
:root{--mesa:#ECEAE4;--mesa-tinta:#5f6a6a;--ink:#14222d}
:root[data-tema=escuro]{--mesa:#0E1113;--mesa-tinta:#8c9898;--ink:#eef3f6}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--mesa);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",system-ui,sans-serif}
body{display:flex;flex-direction:column;align-items:center;padding:18px 12px 28px}
.selo{margin:0 0 14px;font-size:11px;letter-spacing:.06em;color:var(--mesa-tinta)}
.iphone{width:390px;max-width:100%;padding:11px;border-radius:60px;background:linear-gradient(160deg,#3a3c40,#1a1b1e 40%,#101113);box-shadow:0 40px 90px rgba(0,0,0,.35),inset 0 0 0 2px #0a0a0b,inset 0 0 0 3px #4a4c50;position:relative}
.iphone::before,.iphone::after{content:"";position:absolute;background:#2a2c30;border-radius:3px}
.iphone::before{left:-3px;top:150px;width:3px;height:64px}
.iphone::after{right:-3px;top:190px;width:3px;height:92px}
.tela{width:100%;height:792px;border-radius:49px;background:#eef3f6;overflow:hidden;position:relative;display:flex;flex-direction:column}
.ilha{position:absolute;top:11px;left:50%;transform:translateX(-50%);width:118px;height:34px;border-radius:20px;background:#000;z-index:3}
.estado{display:flex;justify-content:space-between;align-items:center;padding:17px 30px 0;font-size:15px;font-weight:600;height:52px;color:#14222d;flex:none}
.estado .icones{display:flex;align-items:center;gap:6px}
.sinal{display:inline-flex;align-items:flex-end;gap:2px;height:11px}.sinal i{display:block;width:3px;background:#14222d;border-radius:1px}
.wifi{width:15px;height:11px;border-radius:50% 50% 0 0;border:2.5px solid #14222d;border-bottom:0;position:relative;top:1px}
.bateria{width:26px;height:12px;border:1.5px solid #14222d;border-radius:4px;position:relative;padding:1.5px}.bateria i{display:block;height:100%;width:80%;background:#14222d;border-radius:2px}.bateria::after{content:"";position:absolute;right:-4px;top:3px;width:2px;height:5px;background:#14222d;border-radius:1px}
.app{flex:1;min-height:0;border:0;width:100%;background:#eef3f6}
.inicio{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);width:134px;height:5px;border-radius:3px;background:#14222d;opacity:.9;z-index:3}
@media(max-width:420px){.iphone{padding:8px;border-radius:48px}.tela{border-radius:40px}}
</style>
</head>
<body>
<p class="selo">maquete · a calculadora publicada, dentro do iPhone</p>
<div class="iphone" role="img" aria-label="Calculadora do RCOG no iPhone">
  <div class="tela">
    <div class="ilha" aria-hidden="true"></div>
    <div class="estado"><span id="hora">9:41</span><span class="icones"><span class="sinal" aria-hidden="true"><i style="height:4px"></i><i style="height:6px"></i><i style="height:8px"></i><i style="height:11px"></i></span><span class="wifi" aria-hidden="true"></span><span class="bateria" aria-hidden="true"><i></i></span></span></div>
    <iframe class="app" id="app" title="Calculadora do RCOG"></iframe>
    <div class="inicio" aria-hidden="true"></div>
  </div>
</div>
<script>
(function(){
  var t = (location.hash.match(/tema=(claro|escuro)/) || [])[1] || (matchMedia('(prefers-color-scheme: dark)').matches ? 'escuro' : 'claro');
  document.documentElement.dataset.tema = t;
  document.getElementById('hora').textContent = new Date().toLocaleTimeString('pt-BR', {hour:'2-digit', minute:'2-digit'});
  var RCOG = "<!doctype html>\n<html lang=\"pt-BR\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width,initial-scale=1,viewport-fit=cover\">\n<meta name=\"theme-color\" content=\"#7f004c\">\n<meta name=\"description\" content=\"Calculadora educacional do score de risco para tromboembolismo venoso em obstetrícia baseada no RCOG.\">\n<title>Score TEV RCOG — Calculadora<\/title>\n<style>\n*{box-sizing:border-box}html,body{margin:0;background:#eef3f6;color:#14222d;font-family:-apple-system,BlinkMacSystemFont,\"Segoe UI\",Roboto,Arial,sans-serif;-webkit-text-size-adjust:100%}body{padding-bottom:40px;overflow-x:hidden}.wrap{width:100%;max-width:820px;margin:auto;padding:6px}.hero{background:#eef8ff;border:1px solid #7faed0;border-radius:14px;padding:14px 8px;text-align:center}.hero h1{margin:0;color:#145582;font-size:clamp(24px,7vw,42px);line-height:1.05}.hero p{margin:7px 0 0;font-size:14px}.scorebar{position:sticky;top:max(6px,env(safe-area-inset-top));z-index:9;margin:8px 0;background:#0e5b8d;color:white;border-radius:14px;padding:7px;display:grid;grid-template-columns:minmax(0,1fr) 68px 70px;gap:7px;align-items:center;box-shadow:0 5px 16px #0003}.scorebar b{text-align:center;font-size:14px}.value{height:50px;background:white;color:#14222d;border-radius:10px;display:grid;place-items:center;font-size:32px;font-weight:900}.scorebar button{height:44px;border:0;border-radius:10px;background:white;color:#0e5b8d;font-weight:800}.section{margin-top:9px;border:1px solid #7faed0;border-radius:12px;overflow:hidden;background:white}.head{display:grid;grid-template-columns:minmax(0,1fr) 48px;background:#edf5fa;color:#164f79;font-weight:800;text-align:center}.head span{padding:8px}.head span+span{border-left:1px solid #aac1cf}.row{display:grid;grid-template-columns:40px minmax(0,1fr) 48px;min-height:45px;background:#ffe600;border-top:1px solid #fff;align-items:stretch}.row.red{background:#bf2931;color:white}.row.orange{background:#e58b33}.row input{width:24px;height:24px;margin:auto;accent-color:#0e5b8d}.txt{padding:7px 4px 7px 0;display:flex;align-items:center;font-size:13.5px;line-height:1.16;overflow-wrap:anywhere}.pts{display:grid;place-items:center;border-left:1px solid #ffffffcc;font-weight:900}.bmi{display:none;grid-template-columns:1fr 1fr;gap:6px;padding:7px;background:#fff8ba}.bmi.show{display:grid}.bmi button{padding:10px 5px;border:1px solid #8fb0c4;border-radius:9px;background:white;color:#145582;font-weight:800}.note{font-size:11px;line-height:1.35;color:#49606e;margin:10px 3px}@media(max-width:390px){.scorebar{grid-template-columns:minmax(0,1fr) 60px 64px}.scorebar b{font-size:12px}.row{grid-template-columns:38px minmax(0,1fr) 44px}.head{grid-template-columns:minmax(0,1fr) 44px}.txt{font-size:13px}}\n<\/style>\n<\/head>\n<body>\n<main class=\"wrap\">\n<header class=\"hero\"><h1>Score para TEV do RCOG<\/h1><p>Fatores de risco de tromboembolismo venoso na gestação e puerpério<\/p><\/header>\n<div class=\"scorebar\"><b>SCORE ACUMULADO<\/b><output class=\"value\" id=\"total\" aria-live=\"polite\">0<\/output><button id=\"clear\" type=\"button\">Limpar<\/button><\/div>\n<div id=\"app\"><\/div>\n<p class=\"note\"><b>Abreviaturas:<\/b> TEV: tromboembolismo venoso; TRA: tecnologia reprodutiva assistida; FIV: fertilização in vitro; HPP: hemorragia pós-parto; SHO: síndrome da hiperestimulação ovariana. <b>Obesidade:<\/b> IMC ≥30 = 1 ponto; IMC ≥40 = 2 pontos. Ferramenta educacional baseada no score RCOG; não substitui avaliação clínica nem a diretriz original.<\/p>\n<\/main>\n<script>\nconst sections=[\n['Fatores de risco preexistentes',[[4,'TEV anterior (exceto um único evento relativo a cirurgia de grande porte)','red'],[3,'TEV prévio provocado por cirurgia de grande porte','orange'],[3,'Trombofilia conhecida de alto risco','orange'],[3,'Comorbidades médicas como câncer, insuficiência cardíaca, LES ativo, poliartropatia inflamatória ou doença intestinal inflamatória, nefrose, DM1 com nefropatia, doença falciforme ou uso atual de drogas intravenosas','orange'],[1,'História familiar de TEV não provocado ou relacionado a estrogênio em parente de primeiro grau'],[1,'Trombofilia de baixo risco conhecida (sem TEV)'],[1,'Idade (>35 anos)'],['bmi','Obesidade'],[1,'Paridade ≥3'],[1,'Tabagismo'],[1,'Veias varicosas de grosso calibre']]],\n['Fatores de risco obstétricos',[[1,'Pré-eclâmpsia na gravidez atual'],[1,'TRA/FIV (somente pré-natais)'],[1,'Gravidez múltipla'],[2,'Cesariana em trabalho de parto','orange'],[1,'Cesariana eletiva'],[1,'Fórcipe médio ou de rotação'],[1,'Trabalho de parto prolongado (>24 horas)'],[1,'HPP (>1 L ou transfusão)'],[1,'Nascimento pré-termo <37+0 semanas na gravidez atual'],[1,'Natimorto na gravidez atual']]],\n['Fatores de risco transitórios',[[3,'Qualquer procedimento cirúrgico durante a gravidez ou o puerpério, exceto reparação imediata do períneo','orange'],[3,'Hiperêmese','orange'],[4,'SHO (apenas no primeiro trimestre)','red'],[1,'Infecção sistêmica atual'],[1,'Imobilidade, desidratação']]]\n];\nconst app=document.getElementById('app');\nsections.forEach(s=>{const sec=document.createElement('section');sec.className='section';sec.innerHTML='<div class=\"head\"><span>'+s[0]+'<\/span><span>Pontos<\/span><\/div>';s[1].forEach(x=>{const row=document.createElement('label');row.className='row '+(x[2]||'');if(x[0]==='bmi'){row.innerHTML='<input class=\"score\" type=\"checkbox\" data-points=\"0\" id=\"obesity\"><span class=\"txt\">Obesidade — marque e escolha o IMC<\/span><span class=\"pts\" id=\"bmiPts\">1/2<\/span>';sec.appendChild(row);const b=document.createElement('div');b.className='bmi';b.id='bmi';b.innerHTML='<button type=\"button\" data-bmi=\"1\">IMC 30–39,9 → +1<\/button><button type=\"button\" data-bmi=\"2\">IMC ≥40 → +2<\/button>';sec.appendChild(b)}else{row.innerHTML='<input class=\"score\" type=\"checkbox\" data-points=\"'+x[0]+'\"><span class=\"txt\">'+x[1]+'<\/span><span class=\"pts\">'+x[0]+'<\/span>';sec.appendChild(row)}});app.appendChild(sec)});\nconst total=document.getElementById('total');\nfunction calc(){let n=0;document.querySelectorAll('.score:checked').forEach(c=>n+=Number(c.dataset.points));total.textContent=String(n)}\ndocument.addEventListener('change',e=>{if(e.target.id==='obesity'){const b=document.getElementById('bmi');if(e.target.checked&&Number(e.target.dataset.points)===0)b.classList.add('show');else{if(!e.target.checked){e.target.dataset.points='0';document.getElementById('bmiPts').textContent='1/2';b.classList.remove('show')}calc()}}else if(e.target.classList.contains('score'))calc()});\ndocument.addEventListener('click',e=>{if(e.target.dataset.bmi){const o=document.getElementById('obesity'),p=Number(e.target.dataset.bmi);o.checked=true;o.dataset.points=String(p);document.getElementById('bmiPts').textContent=String(p);document.getElementById('bmi').classList.remove('show');calc()}});\ndocument.getElementById('clear').addEventListener('click',()=>{document.querySelectorAll('.score').forEach(c=>c.checked=false);const o=document.getElementById('obesity');o.dataset.points='0';document.getElementById('bmiPts').textContent='1/2';document.getElementById('bmi').classList.remove('show');calc()});\ncalc();\n<\/script>\n<\/body>\n<\/html>\n";
  document.getElementById('app').src = URL.createObjectURL(new Blob([RCOG], {type: 'text/html'}));
})();
</script>
</body>
</html>
